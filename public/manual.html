<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>사용설명서 (관리자 전용) - WITH+</title>
<style>
body{max-width:900px;margin:0 auto;padding:24px;font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.7;color:#222}
table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}th,td{border:1px solid #ddd;padding:6px 10px}th{background:#f6f6f6}
code{background:#f1f1f1;padding:1px 5px;border-radius:4px}pre{background:#0f172a;color:#eee;padding:12px;border-radius:8px;overflow:auto}
h1,h2{border-bottom:1px solid #eee;padding-bottom:.2em}
.manual-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.manual-badge{font-size:12px;font-weight:700;color:#fff;background:#D32F5B;border-radius:999px;padding:4px 10px}
.manual-gate{text-align:center;padding:80px 16px;color:#666}
.manual-gate a{display:inline-block;margin-top:16px;padding:10px 22px;background:#D32F5B;color:#fff;border-radius:24px;text-decoration:none;font-weight:600}
</style>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="/typography.css">
</head>
<body data-wp-no-shell>
<div class="manual-top"><a href="/admin">← 관리자 화면</a><span class="manual-badge">관리자 전용</span></div>
<div id="manual-root"><div class="manual-gate">⏳ 권한을 확인하는 중...</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/withplus-common.js"></script>
<script>
(async function () {
    const root = document.getElementById('manual-root');
    const gate = (msg, link) => { root.innerHTML = `<div class="manual-gate"><h2 style="border:none">🔒 ${msg}</h2>${link || ''}</div>`; };
    try {
        const token = await WithPlus.getAccessToken();
        if (!token) return gate('관리자 로그인이 필요합니다', '<a href="/login">로그인</a>');
        const res = await fetch('/api/admin/manual', { headers: { Authorization: 'Bearer ' + token } });
        if (res.status === 401) return gate('관리자 로그인이 필요합니다', '<a href="/login">로그인</a>');
        if (res.status === 403) return gate('사용설명서는 관리자만 볼 수 있습니다', '<a href="/">홈으로</a>');
        const json = await res.json();
        if (!res.ok || !json.success) throw new Error(json.message || '불러오지 못했습니다');
        root.innerHTML = json.html; // 서버 저장소에 있는 정적 문서(관리자 작성)라 그대로 렌더링
        if (location.hash) { const el = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (el) el.scrollIntoView(); }
    } catch (e) {
        gate('사용설명서를 불러오지 못했습니다: ' + WithPlus.escapeHtml(e.message));
    }
})();
</script>
</body>
</html>
