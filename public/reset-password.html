<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 - WITH+</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary-color: #D32F5B; --primary-dark: #B0154F; --bg-light: #F5F5F5; --text-dark: #333; --text-gray: #666; --border-color: #E0E0E0; }
        body { font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text-dark); }
        .top-logo { text-align: center; padding: 30px 20px 10px; }
        .top-logo a { font-size: 1.8em; font-weight: bold; color: var(--primary-color); text-decoration: none; }
        .auth-wrap { max-width: 420px; margin: 20px auto 80px; padding: 0 20px; }
        .auth-box { background: white; border: 1px solid var(--border-color); border-radius: 16px; padding: 40px 30px; }
        .auth-box h1 { font-size: 1.4em; text-align: center; margin-bottom: 10px; }
        .auth-box .sub { text-align: center; color: var(--text-gray); font-size: 0.88em; margin-bottom: 25px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 0.85em; color: var(--text-gray); margin-bottom: 6px; }
        .field input { width: 100%; padding: 12px 14px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1em; }
        .field input:focus { outline: none; border-color: var(--primary-color); }
        .submit-btn { width: 100%; padding: 14px; background: var(--primary-color); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 1em; cursor: pointer; margin-top: 8px; }
        .submit-btn:hover { background: var(--primary-dark); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg { margin-top: 14px; font-size: 0.9em; padding: 10px 12px; border-radius: 8px; display: none; }
        .msg.error { display: block; background: #FDECEA; color: #C62828; }
        .msg.success { display: block; background: #E8F5E9; color: #2E7D32; }
        .back-home { text-align: center; margin-top: 16px; }
        .back-home a { color: var(--text-gray); text-decoration: none; font-size: 0.85em; }
        .state-box { text-align: center; padding: 20px; color: var(--text-gray); }
    </style>
</head>
<body>
    <div class="top-logo"><a href="/">WITH+</a></div>
    <div class="auth-wrap">
        <div class="auth-box">
            <h1>🔒 비밀번호 재설정</h1>
            <p class="sub">새로 사용하실 비밀번호를 입력해주세요</p>

            <div id="invalid-link-box" class="state-box" style="display:none;">
                <p>재설정 링크가 유효하지 않거나 만료되었습니다.<br>로그인 화면에서 다시 요청해주세요.</p>
            </div>

            <form id="reset-form" style="display:none;">
                <div class="field">
                    <label for="new-password">새 비밀번호</label>
                    <input type="password" id="new-password" required minlength="6" autocomplete="new-password">
                </div>
                <div class="field">
                    <label for="new-password-confirm">새 비밀번호 확인</label>
                    <input type="password" id="new-password-confirm" required minlength="6" autocomplete="new-password">
                </div>
                <button type="submit" class="submit-btn" id="submit-btn">비밀번호 변경하기</button>
                <div class="msg" id="msg"></div>
            </form>
        </div>
        <div class="back-home"><a href="/login">← 로그인으로 돌아가기</a></div>
    </div>

    <script src="/vendor/supabase.min.js"></script>
    <script src="/withplus-common.js"></script>
    <script>
        (async function () {
            const form = document.getElementById('reset-form');
            const invalidBox = document.getElementById('invalid-link-box');
            const msg = document.getElementById('msg');
            const submitBtn = document.getElementById('submit-btn');

            // Supabase는 재설정 메일 링크로 들어오면 URL 해시(#access_token=...&type=recovery)를 통해
            // 자동으로 "복구 세션"을 만들어줍니다. 이 세션이 있어야만 비밀번호 변경이 가능합니다.
            const session = await WithPlus.getSession();
            if (session) {
                form.style.display = 'block';
            } else {
                invalidBox.style.display = 'block';
            }

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                msg.className = 'msg';

                const pw1 = document.getElementById('new-password').value;
                const pw2 = document.getElementById('new-password-confirm').value;
                if (pw1 !== pw2) {
                    msg.textContent = '비밀번호가 서로 일치하지 않습니다.';
                    msg.className = 'msg error';
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = '변경 중...';

                try {
                    const client = await WithPlus.getClient();
                    const { error } = await client.auth.updateUser({ password: pw1 });

                    if (error) {
                        msg.textContent = error.message;
                        msg.className = 'msg error';
                        submitBtn.disabled = false;
                        submitBtn.textContent = '비밀번호 변경하기';
                        return;
                    }

                    msg.textContent = '비밀번호가 변경되었습니다! 홈으로 이동합니다...';
                    msg.className = 'msg success';
                    setTimeout(() => { location.href = '/'; }, 1200);
                } catch (err) {
                    msg.textContent = '변경 중 오류가 발생했습니다: ' + err.message;
                    msg.className = 'msg error';
                    submitBtn.disabled = false;
                    submitBtn.textContent = '비밀번호 변경하기';
                }
            });
        })();
    </script>
</body>
</html>
