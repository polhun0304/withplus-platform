<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 설치형 앱(PWA) 표준 v1 -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#D32F5B">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="WITH+">
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/icon/apple">
    <script src="/pwa-install.js" defer></script>
    <script src="/voice-dictation.js?v=1" defer></script>
    <title>후기 모아보기 - WITH+</title>
    <meta name="description" content="WITH+ 회원분들의 생생한 후기를 한곳에서">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary-color: #D32F5B; --text-dark: #333333; --text-gray: #666666; --border-color: #E0E0E0; }
        body { font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text-dark); line-height: 1.6; background: #FFFFFF; }
        .header { background: #fff; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .header-main { max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { text-decoration: none; }
        .icon-button { font-size: 1.3em; color: var(--text-dark); position: relative; text-decoration: none; display: inline-block; }
        .cart-badge { position: absolute; top: -8px; right: -8px; background: var(--primary-color); color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 0.75em; font-weight: bold; }
        .live-wrap { max-width: 560px; margin: 60px auto; padding: 0 20px; text-align: center; }
        .live-badge { display: inline-flex; align-items: center; gap: 6px; background: #E8125C; color: #fff; font-weight: 800; border-radius: 999px; padding: 6px 16px; letter-spacing: .06em; }
        .live-badge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
        .live-wrap h1 { font-size: 1.6em; margin: 18px 0 10px; }
        .live-wrap p { color: var(--text-gray); margin-bottom: 26px; }
        .live-wrap a.btn { display: inline-block; background: #FFF0F4; color: #E8125C; font-weight: 700; text-decoration: none; border-radius: 999px; padding: 12px 26px; }
    </style>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="/typography.css">
    <style>
        .rv-wrap { max-width: 1100px; margin: 26px auto 60px; padding: 0 16px; }
        .rv-wrap h1 { font-size: 1.5em; margin: 0 0 6px; }
        .rv-sub { color: #777; font-size: .9em; margin: 0 0 16px; }
        .rv-tabs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
        .rv-tabs button { border: 1px solid #EBD3DB; background: #fff; border-radius: 999px; padding: 8px 16px; font-size: .92em; cursor: pointer; }
        .rv-tabs button.on { background: #E8125C; border-color: #E8125C; color: #fff; font-weight: 700; }
        .rv-tabs label { margin-left: auto; font-size: .9em; display: flex; gap: 6px; align-items: center; cursor: pointer; }
        .rv-search { display: flex; align-items: center; gap: 6px; flex: 1 1 260px; max-width: 420px; border: 1px solid #EBD3DB; background: #fff; border-radius: 999px; padding: 4px 6px 4px 16px; }
        .rv-search input { flex: 1; min-width: 0; border: none; outline: none; font-size: .95em; background: transparent; padding: 6px 0; font-family: inherit; }
        .rv-search button { border: none; background: #E8125C; color: #fff; border-radius: 999px; width: 36px; height: 32px; cursor: pointer; font-size: 1em; padding: 0; }
        .rv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
        .rv-card { border: 1px solid #F1E2E7; border-radius: 14px; overflow: hidden; background: #fff; display: flex; flex-direction: column; }
        .rv-photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
        .rv-photos img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; background: #F6F1F3; cursor: zoom-in; }
        .rv-photos img:first-child:nth-last-child(1) { grid-column: 1 / -1; aspect-ratio: 4/3; }
        .rv-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .rv-meta { display: flex; justify-content: space-between; font-size: .8em; color: #999; }
        .rv-badge { font-size: .75em; font-weight: 700; border-radius: 6px; padding: 2px 7px; background: #E8F5E9; color: #2E7D32; align-self: flex-start; }
        .rv-badge.with { background: #FFF0F4; color: #E8125C; }
        .rv-stars { color: #FFB400; letter-spacing: 1px; font-size: .9em; }
        .rv-text { font-size: .9em; line-height: 1.6; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
        .rv-text.open { display: block; }
        .rv-prod { display: flex; gap: 8px; align-items: center; border-top: 1px solid #F5EAEE; padding: 10px 14px; text-decoration: none; color: inherit; font-size: .85em; }
        .rv-prod img { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; background: #F6F1F3; }
        .rv-more { display: block; margin: 22px auto 0; padding: 12px 28px; border-radius: 999px; border: 1px solid #E8125C; background: #fff; color: #E8125C; font-weight: 700; cursor: pointer; }
        .rv-empty { text-align: center; color: #999; padding: 50px 0; }
        .rv-zoom { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: none; align-items: center; justify-content: center; z-index: 2000; cursor: zoom-out; }
        .rv-zoom img { max-width: 92vw; max-height: 90vh; border-radius: 10px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-main">
            <a href="/" class="logo" aria-label="WITH+ 홈"><img src="/images/brand/withplus-logo.webp" alt="WITH+" class="wp-logo-img" width="130" height="40"><span class="wp-logo-tagline">함께할수록 <b>더해지는 가치</b></span></a>
            <div style="display:flex; gap:20px; align-items:center;">
                <a class="icon-button" id="account-link" href="/login">👤</a>
                <a class="icon-button" href="/cart">🛒<span class="cart-badge">0</span></a>
            </div>
        </div>
    </header>

        <main class="rv-wrap">
        <h1>💬 후기 모아보기</h1>
        <p class="rv-sub">WITH+ 회원분들의 생생한 후기를 한곳에 모았습니다. 작성자 이름은 가려서 보여드립니다.</p>
        <div class="rv-tabs" id="rv-tabs">
            <form class="rv-search" id="rv-search" role="search"><input type="search" id="rv-q" placeholder="상품명·후기 내용으로 검색" maxlength="40" autocomplete="off"><button type="submit" aria-label="후기 검색">🔍</button></form>
            <label><input type="checkbox" id="rv-photo"> 📷 사진 후기만</label>
        </div>
        <div class="rv-grid" id="rv-grid"></div>
        <button class="rv-more" id="rv-more" style="display:none;">후기 더 보기</button>
    </main>
    <div class="rv-zoom" id="rv-zoom"><img alt=""></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/withplus-pricing.js"></script>
    <script src="/withplus-common.js"></script>
    <script>
        WithPlus.initHeader();
        (function () {
            const st = { src: 'all', photo: false, page: 1, q: '' };
            const grid = document.getElementById('rv-grid'), more = document.getElementById('rv-more');
            const esc = WithPlus.escapeHtml, url = WithPlus.safeUrlAttr;
            async function load(reset) {
                if (reset) { st.page = 1; grid.innerHTML = '<p class="rv-empty">불러오는 중...</p>'; }
                const qs = new URLSearchParams({ source: st.src, page: st.page, size: 24 });
                if (st.photo) qs.set('photo', '1');
                if (st.q) qs.set('q', st.q);
                const res = await fetch('/api/reviews/all?' + qs).then(r => r.json()).catch(() => null);
                const list = (res && res.success && res.data) || [];
                if (reset) grid.innerHTML = '';
                if (!list.length && st.page === 1) { grid.innerHTML = '<p class="rv-empty">' + (st.q ? '\'' + esc(st.q) + '\' 검색 결과가 없습니다' : '아직 공개된 후기가 없습니다') + '</p>'; more.style.display = 'none'; return; }
                grid.insertAdjacentHTML('beforeend', list.map(r => `
                    <div class="rv-card">
                        ${r.photos && r.photos.length ? `<div class="rv-photos">${r.photos.slice(0, 3).map(p => `<img src="${url(p)}" loading="lazy" alt="후기 사진">`).join('')}</div>` : ''}
                        <div class="rv-body">
                            ${r.rating ? `<div class="rv-stars">${'★'.repeat(r.rating)}<span style="color:#E6E6E6">${'★'.repeat(5 - r.rating)}</span></div>` : ''}
                            <div class="rv-text">${esc(r.text || '')}</div>
                            <div class="rv-meta"><span>${esc(r.author)}님</span><span>${r.at ? WithPlus.timeAgo(r.at) : ''}</span></div>
                        </div>
                        ${r.product ? `<a class="rv-prod" href="/product/${encodeURIComponent(r.product.id)}">${r.product.image ? `<img src="${url(r.product.image)}" alt="">` : ''}<span>${esc(r.product.name)} ›</span></a>` : ''}
                    </div>`).join(''));
                more.style.display = (res.total > st.page * res.size) ? '' : 'none';
            }
            document.getElementById('rv-search').addEventListener('submit', (e) => {
                e.preventDefault();
                st.q = document.getElementById('rv-q').value.trim();
                load(true);
            });
            document.getElementById('rv-q').addEventListener('input', (e) => {
                if (!e.target.value && st.q) { st.q = ''; load(true); } // 검색어를 다 지우면 전체 후기로 돌아간다
            });
            document.getElementById('rv-photo').addEventListener('change', (e) => { st.photo = e.target.checked; load(true); });
            more.addEventListener('click', () => { st.page++; load(false); });
            const zoom = document.getElementById('rv-zoom');
            grid.addEventListener('click', (e) => {
                if (e.target.matches('.rv-photos img')) { zoom.querySelector('img').src = e.target.src; zoom.style.display = 'flex'; }
                if (e.target.matches('.rv-text')) e.target.classList.toggle('open');
            });
            zoom.addEventListener('click', () => { zoom.style.display = 'none'; });
            load(true);
        })();
    </script>
</body>
</html>
