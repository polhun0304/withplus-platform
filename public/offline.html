<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오프라인 상태입니다 - WITH+</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #FFFFFF;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .box .emoji { font-size: 4em; margin-bottom: 20px; }
        .box h1 { font-size: 1.6em; margin-bottom: 10px; }
        .box p { color: #666; margin-bottom: 30px; line-height: 1.6; }
        .box button {
            display: inline-block;
            padding: 12px 32px;
            background: #D32F5B;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 24px;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
        }
        .box button:hover { background: #B0154F; }
    </style>
</head>
<body>
    <div class="box">
        <div class="emoji">📡</div>
        <h1>인터넷 연결이 끊겼습니다</h1>
        <p>지금은 오프라인 상태라 이 페이지를 불러올 수 없어요.<br>연결이 복구되면 자동으로 다시 이용하실 수 있습니다.</p>
        <button type="button" onclick="location.reload()">다시 시도하기</button>
    </div>
</body>
</html>
