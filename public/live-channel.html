<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 설치형 앱(PWA) 표준 v1 -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#D32F5B">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="WITH+">
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/icon/apple">
    <script src="/pwa-install.js" defer></script>
    <title>라이브 채널 - WITH+</title>
    <meta name="description" content="WITH+ 라이브 쇼핑 - 실시간 방송을 보며 라이브 전용가로 바로 구매하세요.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-color: #E91E63;
            --bg-white: #FFFFFF;
            --bg-light: #F7F7F8;
            --text-dark: #222222;
            --text-gray: #666666;
            --border-color: #E5E5E5;
            --live-red: #FF3B30;
        }
        body { font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text-dark); line-height: 1.6; background: var(--bg-light); padding-bottom: 90px; }
        a { color: inherit; }
        .app-wrap { max-width: 720px; margin: 0 auto; background: var(--bg-white); min-height: 100vh; }

        .header { border-bottom: 1px solid var(--border-color); position: sticky; top: 0; background: white; z-index: 20; }
        .header-inner { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; }
        .ch-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.98em; min-width: 0; }
        /* 🏪 크리에이터 스토어프론트(경쟁사 기능 격차 백로그 4번) - 방송 중이 아니어도 채널 정체성이 드러나도록
           커버이미지/한줄소개/채널소개를 항상 노출한다(sticky 헤더 아래, 비sticky). */
        .ch-cover { width: 100%; max-height: 160px; object-fit: cover; display: block; }
        .ch-intro { padding: 10px 16px 12px; border-bottom: 1px solid var(--border-color); background: var(--bg-white, #fff); }
        .ch-tagline { font-size: 0.85em; color: var(--text-gray); margin-bottom: 4px; }
        .ch-description summary { font-size: 0.78em; color: var(--primary-color); cursor: pointer; font-weight: 600; }
        .ch-description p { font-size: 0.82em; color: var(--text-gray); margin-top: 6px; white-space: pre-line; line-height: 1.5; }
        .ch-brand .logo-img, .ch-brand .logo-emoji-box {
            width: 32px; height: 32px; object-fit: cover; border-radius: 50%; flex-shrink: 0;
        }
        .ch-brand .logo-emoji-box { display: flex; align-items: center; justify-content: center; background: var(--bg-light); font-size: 1.1em; }
        .ch-brand .brand-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ch-brand .official-badge { font-size: 0.68em; background: #1976D2; color: white; padding: 2px 6px; border-radius: 8px; margin-left: 4px; vertical-align: middle; }
        /* 🏆 크리에이터(채널) 등급/랭킹 배지 - 그립/아마존 "TOP 판매자" 컨셉. 등급은 은은한 회색, TOP3는 눈에 띄는 주황색으로 구분. */
        .ch-brand .tier-badge { font-size: 0.68em; background: #616161; color: white; padding: 2px 6px; border-radius: 8px; margin-left: 4px; vertical-align: middle; }
        .ch-brand .top3-badge { font-size: 0.68em; background: #FF6F00; color: white; padding: 2px 6px; border-radius: 8px; margin-left: 4px; vertical-align: middle; font-weight: 700; }
        .header-right { display: flex; align-items: center; gap: 10px; font-size: 0.8em; flex-shrink: 0; }
        .header-right a { text-decoration: none; color: var(--text-gray); white-space: nowrap; }
        .join-btn {
            background: var(--primary-color); color: white; border: none; border-radius: 16px;
            padding: 7px 14px; font-size: 0.82em; font-weight: 700; cursor: pointer; white-space: nowrap;
        }
        .join-btn[disabled] { background: #ccc; cursor: default; }

        .state-box { text-align: center; padding: 80px 20px; color: var(--text-gray); }
        .state-box .emoji { font-size: 2.6em; margin-bottom: 14px; }

        .live-banner {
            background: linear-gradient(135deg, #1a1a1a, #333); color: white; padding: 18px 16px; position: relative;
        }
        .live-banner .live-tag {
            display: inline-flex; align-items: center; gap: 4px; background: var(--live-red); color: white;
            font-size: 0.72em; font-weight: 800; padding: 3px 8px; border-radius: 4px; margin-bottom: 8px;
        }
        .live-banner .live-tag .dot { width: 6px; height: 6px; border-radius: 50%; background: white; animation: pulse 1.4s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        .live-banner h2 { font-size: 1.15em; margin-bottom: 4px; }
        .live-banner .live-meta { font-size: 0.78em; opacity: 0.8; }
        .live-banner .viewer-count-badge { display: inline-block; font-size: 0.72em; font-weight: 700; margin-left: 6px; opacity: 0.9; }
        .recent-purchase-ticker { font-size: 0.76em; opacity: 0.85; margin-top: 6px; background: rgba(255,255,255,0.12); padding: 4px 8px; border-radius: 6px; display: inline-block; }

        .offline-banner { background: var(--bg-light); padding: 16px; text-align: center; color: var(--text-gray); font-size: 0.85em; border-bottom: 1px solid var(--border-color); }

        .replay-banner { background: linear-gradient(135deg, #2b2b3d, #4a4a68); color: white; padding: 18px 16px; }
        .replay-banner .replay-tag {
            display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.18); color: white;
            font-size: 0.72em; font-weight: 800; padding: 3px 8px; border-radius: 4px; margin-bottom: 8px;
        }
        .replay-banner h2 { font-size: 1.15em; margin-bottom: 4px; }
        .replay-banner .live-meta { font-size: 0.78em; opacity: 0.85; }
        .replay-links { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
        .replay-links a {
            display: inline-block; background: rgba(255,255,255,0.16); color: white; text-decoration: none;
            font-size: 0.78em; font-weight: 700; padding: 6px 12px; border-radius: 16px;
        }
        .replay-highlights { margin-top: 12px; }
        .replay-highlights .highlights-label { font-size: 0.72em; opacity: 0.8; margin-bottom: 6px; }
        .replay-highlights .highlight-list { display: flex; gap: 6px; flex-wrap: wrap; }
        .replay-highlights a {
            display: inline-block; background: rgba(255,109,0,0.85); color: white; text-decoration: none;
            font-size: 0.72em; font-weight: 700; padding: 4px 10px; border-radius: 12px;
        }
        .guest-badge { display: inline-block; background: #6C4FE0; color: white; font-size: 0.7em; font-weight: 800; padding: 1px 6px; border-radius: 8px; margin-right: 4px; }
        .guest-pinned-card {
            display: flex; align-items: center; gap: 8px; background: #f4f0ff; border: 1px solid #6C4FE0;
            margin: 8px 16px; padding: 8px 12px; border-radius: 10px; font-size: 0.82em;
        }
        .guest-pinned-card .guest-tag { font-weight: 800; color: #6C4FE0; }

        .pinned-card {
            display: flex; gap: 12px; background: #fff; margin: 12px 16px; padding: 12px; border-radius: 12px;
            border: 2px solid var(--live-red); box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }
        .pinned-card .thumb { width: 84px; height: 84px; border-radius: 8px; background: var(--bg-light) center/cover no-repeat; flex-shrink: 0; }
        .pinned-card .info { flex: 1; min-width: 0; }
        .pinned-card .pin-label { font-size: 0.7em; font-weight: 800; color: var(--live-red); margin-bottom: 3px; }
        .pinned-card .name { font-size: 0.92em; font-weight: 700; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pinned-card .price { font-size: 0.95em; font-weight: 800; color: var(--primary-color); }
        .pinned-card .stock-note { font-size: 0.74em; color: var(--text-gray); margin-top: 2px; }

        .section-title { padding: 18px 16px 8px; font-size: 1em; font-weight: 700; }
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px 16px; }
        .product-card { border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; background: white; display: flex; flex-direction: column; }
        .product-card .thumb { width: 100%; aspect-ratio: 1/1; background: var(--bg-light) center/cover no-repeat; position: relative; }
        .product-card .thumb .pin-flag { position: absolute; top: 6px; left: 6px; background: var(--live-red); color: white; font-size: 0.62em; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
        .product-card .thumb .flash-flag, .pinned-card .flash-flag {
            position: absolute; top: 6px; right: 6px; background: #FF6D00; color: white; font-size: 0.62em; font-weight: 800;
            padding: 2px 6px; border-radius: 4px; display: flex; align-items: center; gap: 3px;
        }
        .price-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
        .price-row .orig-price { font-size: 0.78em; color: var(--text-gray); text-decoration: line-through; font-weight: 500; }
        .flash-timer { font-size: 0.7em; font-weight: 800; color: #FF6D00; }
        .product-card .body { padding: 8px 10px 10px; flex: 1; display: flex; flex-direction: column; }
        .product-card .name { font-size: 0.82em; font-weight: 600; margin-bottom: 4px; line-height: 1.35; min-height: 2.2em; overflow: hidden; }
        .product-card .price { font-size: 0.88em; font-weight: 800; color: var(--primary-color); margin-bottom: 6px; }
        .product-card .avail { font-size: 0.7em; color: var(--text-gray); margin-bottom: 6px; }
        .product-card .avail.low { color: var(--live-red); font-weight: 700; }
        .product-card .qty-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
        .product-card .qty-row button { width: 24px; height: 24px; border: 1px solid var(--border-color); background: white; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
        .product-card .qty-row .qty-val { flex: 1; text-align: center; font-size: 0.82em; font-weight: 600; }
        .product-card .buy-btn {
            width: 100%; background: var(--primary-color); color: white; border: none; border-radius: 6px;
            padding: 7px; font-size: 0.78em; font-weight: 700; cursor: pointer; margin-top: auto;
        }
        .product-card .buy-btn[disabled] { background: #ccc; cursor: default; }
        .product-card .buy-btn.secondary { background: white; color: var(--primary-color); border: 1px solid var(--primary-color); margin-top: 4px; }

        .cart-drawer {
            position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid var(--border-color);
            box-shadow: 0 -4px 16px rgba(0,0,0,0.08); z-index: 30; max-width: 720px; margin: 0 auto;
        }
        .cart-drawer .summary-row {
            display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; cursor: pointer;
        }
        .cart-drawer .summary-row .left { font-size: 0.86em; font-weight: 700; }
        .cart-drawer .summary-row .left .count { color: var(--primary-color); }
        .cart-drawer .checkout-btn {
            background: var(--primary-color); color: white; border: none; border-radius: 8px;
            padding: 9px 18px; font-size: 0.85em; font-weight: 700; cursor: pointer;
        }
        .cart-detail { border-top: 1px solid var(--border-color); max-height: 40vh; overflow-y: auto; padding: 6px 16px; display: none; }
        .cart-detail.open { display: block; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 0.8em; }
        .cart-item .timer { font-size: 0.72em; color: var(--live-red); }
        .cart-item .remove-btn { background: none; border: none; color: var(--text-gray); font-size: 0.9em; cursor: pointer; }

        .checkout-panel { padding: 16px; border-top: 4px solid var(--bg-light); }
        .checkout-panel h3 { font-size: 0.95em; margin-bottom: 10px; }
        .checkout-panel .field { margin-bottom: 8px; }
        .checkout-panel label { display: block; font-size: 0.76em; color: var(--text-gray); margin-bottom: 3px; }
        .checkout-panel input {
            width: 100%; padding: 9px 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.85em;
        }
        .checkout-panel .submit-btn {
            width: 100%; background: var(--primary-color); color: white; border: none; border-radius: 8px;
            padding: 12px; font-size: 0.9em; font-weight: 700; cursor: pointer; margin-top: 8px;
        }
        .checkout-panel .submit-btn[disabled] { background: #ccc; cursor: default; }
        .checkout-panel .msg { font-size: 0.78em; margin-top: 8px; text-align: center; }
        .checkout-panel .msg.error { color: var(--live-red); }
        .checkout-panel .msg.success { color: #2E7D32; }

        .chat-section { border-top: 8px solid var(--bg-light); padding: 14px 16px; }
        .chat-header { font-weight: 700; font-size: 0.9em; margin-bottom: 8px; }
        .chat-log { height: 220px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 10px; background: var(--bg-light); margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
        .chat-msg { font-size: 0.8em; line-height: 1.4; word-break: break-word; }
        .chat-msg .chat-name { font-weight: 700; color: var(--primary-color); margin-right: 4px; }
        .chat-msg.mine .chat-name { color: #1976D2; }
        .quiz-correct-badge { display: inline-block; background: #FF6D00; color: white; font-size: 0.7em; font-weight: 800; padding: 1px 6px; border-radius: 8px; margin-right: 4px; }
        .quiz-banner {
            background: #FFF3E0; border: 1px solid #FFB74D; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 0.82em;
        }
        .quiz-banner .q-title { font-weight: 800; color: #E65100; margin-bottom: 3px; }
        .quiz-banner .q-progress { font-size: 0.85em; color: var(--text-gray); }
        /* 🔨 실시간 경매(경쟁사 기능 격차 백로그 5번) */
        .auction-banner { background: #FCE4EC; border: 1px solid var(--primary-color, #D32F5B); border-radius: 10px; padding: 12px 14px; margin: 8px 16px; font-size: 0.85em; }
        .auction-banner .a-title { font-weight: 800; color: var(--primary-color, #D32F5B); margin-bottom: 4px; }
        .auction-banner .a-price { font-size: 0.95em; margin-bottom: 3px; }
        .auction-banner .a-count { font-size: 0.8em; color: var(--text-gray); }
        .auction-banner .a-timer { font-size: 0.82em; color: #C62828; font-weight: 700; margin-bottom: 8px; }
        .auction-banner .a-bid-row { display: flex; gap: 6px; }
        .auction-banner .a-bid-row input { flex: 1; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.95em; }
        .auction-banner .a-bid-row button { background: var(--primary-color, #D32F5B); color: white; border: none; border-radius: 6px; padding: 8px 16px; font-weight: 700; cursor: pointer; }
        .auction-banner.auction-won { background: #FFF3E0; border-color: #FF6D00; }
        .auction-banner.auction-won .a-title { color: #E65100; }
        .auction-banner.auction-won .a-mypage-link { display: inline-block; margin-top: 6px; color: var(--primary-color, #D32F5B); font-weight: 700; text-decoration: none; }
        .auction-banner.auction-ended { background: var(--bg-light, #F5F5F5); border-color: var(--border-color); }
        .auction-banner.auction-ended .a-title { color: var(--text-gray); }
        /* 🎟️ 선착순 다운로드 쿠폰함(경쟁사 기능 격차 백로그 7번) */
        .coupon-drop-banner { background: #FFF3E0; border: 1px solid #FFB74D; border-radius: 10px; padding: 12px 14px; margin: 8px 16px; }
        .coupon-drop-banner .cd-title { font-weight: 800; color: #E65100; font-size: 0.85em; margin-bottom: 8px; }
        .coupon-drop-banner .cd-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: white; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; }
        .coupon-drop-banner .cd-item:last-child { margin-bottom: 0; }
        .coupon-drop-banner .cd-label { font-size: 0.85em; font-weight: 700; }
        .coupon-drop-banner .cd-discount { color: var(--live-red, #D32F5B); font-weight: 800; }
        .coupon-drop-banner .cd-remain { font-size: 0.72em; color: var(--text-gray); margin-top: 2px; }
        .coupon-drop-banner .cd-claim-btn { background: #FF6D00; color: white; border: none; border-radius: 6px; padding: 8px 14px; font-weight: 700; cursor: pointer; font-size: 0.82em; white-space: nowrap; }
        .coupon-drop-banner .cd-claim-btn[disabled] { background: #ccc; cursor: default; }
        .quiz-win-toast {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 60; max-width: 90vw;
            background: #FF6D00; color: white; font-size: 0.85em; font-weight: 600; padding: 12px 18px; border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2); transition: opacity 0.6s ease; text-align: center;
        }
        /* 🎁 실시간 가상 선물/후원(경쟁사 기능 격차 백로그 6번) */
        .chat-msg.gift-msg { background: #FFF8E1; border-radius: 8px; padding: 4px 8px; color: #E65100; font-weight: 600; }
        .gift-send-btn { background: #FFB300; color: white; border: none; border-radius: 6px; padding: 0 12px; font-weight: 700; cursor: pointer; font-size: 0.85em; }
        .gift-picker { display: none; flex-wrap: wrap; gap: 6px; background: #FFF8E1; border: 1px solid #FFE082; border-radius: 8px; padding: 10px; margin-top: 6px; }
        .gift-picker.open { display: flex; }
        .gift-picker .gift-item { display: flex; flex-direction: column; align-items: center; gap: 2px; background: white; border: 1px solid #FFE082; border-radius: 8px; padding: 8px 10px; cursor: pointer; min-width: 56px; }
        .gift-picker .gift-item:hover { background: #FFF3E0; }
        .gift-picker .gift-item .g-emoji { font-size: 1.4em; }
        .gift-picker .gift-item .g-label { font-size: 0.68em; color: var(--text-gray); }
        .gift-picker .gift-item .g-cost { font-size: 0.68em; font-weight: 700; color: #E65100; }
        .gift-picker .gift-balance { width: 100%; font-size: 0.72em; color: var(--text-gray); margin-bottom: 2px; }
        .chat-empty { text-align: center; color: var(--text-gray); font-size: 0.78em; padding: 20px 0; }
        .chat-load-older-btn {
            display: block; width: 100%; background: none; border: none; color: var(--primary-color);
            font-size: 0.76em; font-weight: 600; padding: 4px 0 8px; cursor: pointer;
        }
        .chat-load-older-btn[disabled] { color: var(--text-gray); cursor: default; }
        .chat-input-row { display: flex; gap: 6px; }
        .chat-input-row input { flex: 1; padding: 9px 12px; border: 1px solid var(--border-color); border-radius: 18px; font-size: 0.82em; }
        .chat-input-row button {
            background: var(--primary-color); color: white; border: none; border-radius: 18px;
            padding: 9px 16px; font-size: 0.8em; font-weight: 700; cursor: pointer; white-space: nowrap;
        }
        .chat-input-row button[disabled] { background: #ccc; cursor: default; }
        .chat-offline-note { text-align: center; color: var(--text-gray); font-size: 0.76em; padding: 8px 0 0; }

        /* 오른쪽 아래 떠 있는 공유 버튼(🔗·공유쿠폰)이 맨 아래 채팅 입력줄(선물 버튼)을 가리지 않도록 끝까지 스크롤하면 위로 올라오게 여백 */
        #app-dyn { padding-bottom: 110px; }
        .share-btn {
            position: fixed; right: 16px; bottom: 100px; z-index: 25; background: white; border: 1px solid var(--border-color);
            border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
            font-size: 1.2em; box-shadow: 0 2px 8px rgba(0,0,0,0.12); cursor: pointer;
        }
        /* 🎁 바이럴 공유쿠폰(소문내면 할인) 버튼 - 기존 단순 링크공유(🔗) 버튼 바로 위에 알약 모양으로 노출.
           할인율이 설정돼 있을 때만(shareCouponDiscountPercent > 0) render()가 이 버튼을 그린다. */
        .share-coupon-btn {
            position: fixed; right: 16px; bottom: 152px; z-index: 25; background: var(--primary-color, #D32F5B); color: white; border: none;
            border-radius: 22px; padding: 9px 14px; display: flex; align-items: center; gap: 4px;
            font-size: 0.78em; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,0.18); cursor: pointer; white-space: nowrap;
        }

        .order-complete { text-align: center; padding: 60px 24px; }
        .order-complete .emoji { font-size: 3em; margin-bottom: 14px; }
        .order-complete h2 { font-size: 1.1em; margin-bottom: 8px; }
        .order-complete p { font-size: 0.85em; color: var(--text-gray); margin-bottom: 6px; }
        .order-complete a { display: inline-block; margin-top: 16px; color: var(--primary-color); font-weight: 700; text-decoration: none; }

        /* 📹 방송 영상 영역 - 실제 방송 중일 때만 채워지는 고정(persistent) 컨테이너. 헤더와 본문(#app-dyn)
           사이의 별도 DOM 노드로 둬서, 15초 폴링마다 본문이 통째로 다시 그려져도 영상 요소(특히 브라우저
           방송 WebRTC 연결)는 계속 유지된다. */
        #video-hero-stable:empty { display: none; }
        .video-hero-box { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
        .video-hero-box video, .video-hero-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
        .video-hero-box .video-live-flag {
            position: absolute; top: 10px; left: 10px; background: var(--live-red); color: white; font-size: 0.72em;
            font-weight: 800; padding: 4px 9px; border-radius: 10px; display: flex; align-items: center; gap: 4px; z-index: 2;
        }
        .video-hero-box .video-live-flag .dot { width: 6px; height: 6px; background: white; border-radius: 50%; animation: pulse-dot 1.4s infinite; }
        @keyframes pulse-dot { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
        .video-offline-box {
            width: 100%; padding: 22px 16px; text-align: center; background: #1a1a1a; color: #bbb; font-size: 0.82em;
        }

        /* ❤️ 단골 맺기(채널 가입) + 단골 수 뱃지 */
        .member-count-badge { font-size: 0.7em; color: var(--text-gray); font-weight: 500; white-space: nowrap; }

        /* ⚡ 라이브 전용가 뱃지 */
        .live-only-flag {
            display: inline-flex; align-items: center; gap: 3px; background: #FFF3E0; color: #E65100;
            font-size: 0.72em; font-weight: 800; padding: 2px 7px; border-radius: 8px; margin-bottom: 4px;
        }

        /* 🗂️ 카테고리 아이콘 행 */
        .category-icon-row { display: flex; gap: 6px; overflow-x: auto; padding: 10px 14px; background: var(--bg-white, #fff); border-bottom: 1px solid var(--border-color, #eee); -webkit-overflow-scrolling: touch; }
        .category-icon-row::-webkit-scrollbar { display: none; }
        .category-icon-item { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; padding: 4px 8px; cursor: pointer; color: var(--text-gray, #666); }
        .category-icon-item .ci-emoji { font-size: 1.3em; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: var(--bg-light, #F5F5F5); border-radius: 50%; }
        .category-icon-item .ci-label { font-size: 0.72em; white-space: nowrap; }
        .category-icon-item.active .ci-emoji { background: var(--primary-color, #D32F5B); }
        .category-icon-item.active .ci-label { color: var(--primary-color, #D32F5B); font-weight: 700; }
    </style>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="/typography.css">
    <link rel="stylesheet" href="/withplus-live.css">
</head>
<body data-wp-no-tabbar>
    <div class="app-wrap" id="app-root">
        <div class="state-box">
            <div class="emoji">📡</div>
            <h3>불러오는 중입니다...</h3>
        </div>
    </div>

    <script src="/vendor/supabase.min.js"></script>
    <script src="/vendor/livekit-client.min.js"></script>
    <script src="/vendor/hls.min.js"></script>
    <script src="/withplus-common.js"></script>
    <script src="/voice-dictation.js?v=1" defer></script>
    <script>
        (async function () {
            const root = document.getElementById('app-root');
            const slug = location.pathname.split('/').filter(Boolean).pop();
            const urlParams = new URLSearchParams(location.search);
            // 딥링크/QR로 들어온 유입 정보 - 나중에 주문 생성 시 live_attribution으로 그대로 실어보낸다.
            // 서버(POST /api/orders)는 이 객체의 필드명을 source_platform/campaign/referrer_code/coupon_code로 읽는다.
            const attribution = {
                source_platform: urlParams.get('platform') || undefined,
                campaign: urlParams.get('campaign') || undefined,
                referrer_code: urlParams.get('ref') || undefined,
                coupon_code: urlParams.get('coupon') || undefined,
                // 🎁 바이럴 공유쿠폰(소문내면 할인) - 다른 시청자의 개인 공유링크를 통해 들어온 경우의 코드.
                // referrer_code(크리에이터 제휴 커미션)와는 완전히 다른 용도라 별도 필드로 분리했다.
                share_code: urlParams.get('share') || undefined
            };

            function showError(title, desc) {
                root.innerHTML = `
                    <div class="state-box">
                        <div class="emoji">🤔</div>
                        <h3>${WithPlus.escapeHtml(title)}</h3>
                        <p style="margin-top:8px;">${WithPlus.escapeHtml(desc)}</p>
                        <p style="margin-top:20px;"><a href="/" style="color:var(--primary-color); text-decoration:none; font-weight:600;">WITH+ 홈으로 가기 →</a></p>
                    </div>`;
            }

            let channel, liveSession, products;
            let channelRank = null; // 🏆 크리에이터(채널) 등급/랭킹(그립/아마존 "TOP 판매자" 배지 컨셉) - 헤더의 "공식" 배지 옆에 노출
            try {
                const [chRes, sessRes, prodRes, rankRes] = await Promise.all([
                    fetch('/api/live/channels/' + encodeURIComponent(slug)),
                    fetch('/api/live/channels/' + encodeURIComponent(slug) + '/sessions/live'),
                    fetch('/api/live/channels/' + encodeURIComponent(slug) + '/products'),
                    fetch('/api/live/channels/' + encodeURIComponent(slug) + '/rank').catch(() => null),
                    WithPlus.refreshCategoryMap(), // 카테고리 아이콘 행(이모지/라벨)에 필요 - 실패해도 카테고리 행만 생략될 뿐 나머지 화면에는 영향 없음
                    loadGiftCatalog() // 🎁 선물 카탈로그 - 실패해도 선물 버튼만 안 보일 뿐 나머지 화면엔 영향 없음
                ]);
                const chJson = await chRes.json();
                if (!chRes.ok || !chJson.success) return showError('채널을 찾을 수 없습니다', chJson.message || '주소를 다시 확인해주세요.');
                channel = chJson.data;
                const sessJson = await sessRes.json();
                liveSession = (sessRes.ok && sessJson.success) ? sessJson.data : null;
                const prodJson = await prodRes.json();
                products = (prodRes.ok && prodJson.success) ? prodJson.data : [];
                if (rankRes) {
                    const rankJson = await rankRes.json().catch(() => null);
                    if (rankRes.ok && rankJson && rankJson.success) channelRank = rankJson.data;
                }
            } catch (err) {
                return showError('불러오지 못했습니다', err.message);
            }

            // 📼 다시보기(VOD) - 지금 라이브 중이 아닐 때만 의미가 있으므로, liveSession이 없을 때만 조회한다.
            // 방송이 다시 시작되면(liveSession이 다시 채워지면) replaySession은 화면에서 쓰지 않는다.
            let replaySession = null;
            async function refreshReplaySession() {
                if (liveSession) { replaySession = null; return; }
                try {
                    const res = await fetch('/api/live/channels/' + encodeURIComponent(slug) + '/sessions/replay');
                    const json = await res.json();
                    if (res.ok && json.success) replaySession = json.data;
                } catch (err) { /* 조회 실패 시 이전 값 유지 */ }
            }
            await refreshReplaySession();

            document.title = `${channel.name} 라이브 - WITH+`;

            // #app-root(.app-wrap) 아래를 세 구역으로 고정 분리한다:
            //   #header-stable   - 브랜드/단골맺기(거의 안 바뀜, 초기 1회 + 가입 시에만 갱신)
            //   #video-hero-stable - 방송 영상(WebRTC는 연결을 끊지 않고 계속 유지해야 함)
            //   #app-dyn         - 나머지 전부(15초 폴링마다 통째로 다시 그려지는 기존 영역, 변경 없음)
            // 예전에는 root.innerHTML 전체를 15초마다 통째로 교체했는데, 그러면 WebRTC(LiveKit) 영상 연결이
            // 매번 끊기고 재연결돼 화면이 계속 깜빡이는 문제가 있어 분리했다.
            root.innerHTML = '<div id="header-stable"></div><div id="video-hero-stable"></div><div id="app-dyn"></div>';
            const dyn = document.getElementById('app-dyn');
            const headerStable = document.getElementById('header-stable');
            const videoHeroStable = document.getElementById('video-hero-stable');
            let memberCount = Number(channel.member_count || 0);

            function renderHeader() {
                headerStable.innerHTML = `
                    <header class="header">
                        <div class="header-inner">
                            <div class="ch-brand">
                                ${channel.logo_url
                                    ? `<img src="${WithPlus.escapeHtml(channel.logo_url)}" alt="${WithPlus.escapeHtml(channel.name)}" class="logo-img">`
                                    : `<span class="logo-emoji-box">🎥</span>`}
                                <span class="brand-text">${WithPlus.escapeHtml(channel.name)}${channel.is_official ? '<span class="official-badge">공식</span>' : ''}${channelRank && channelRank.tier !== 'bronze' ? `<span class="tier-badge">${channelRank.tier_emoji} ${channelRank.tier_label}</span>` : ''}${channelRank && channelRank.top3_rank ? `<span class="top3-badge">🔥 이달의 TOP ${channelRank.top3_rank}</span>` : ''}</span>
                                <span class="member-count-badge" id="ch-member-count">단골 ${memberCount.toLocaleString('ko-KR')}명</span>
                            </div>
                            <div class="header-right">
                                <a href="/login" id="ch-login-link">로그인</a>
                                <button type="button" class="join-btn" id="ch-join-btn">❤️ 단골 맺기</button>
                            </div>
                        </div>
                    </header>
                    ${channel.cover_image_url ? `<img class="ch-cover" src="${WithPlus.escapeHtml(channel.cover_image_url)}" alt="${WithPlus.escapeHtml(channel.name)} 커버 이미지">` : ''}
                    ${(channel.tagline || channel.description) ? `
                    <div class="ch-intro">
                        ${channel.tagline ? `<div class="ch-tagline">${WithPlus.escapeHtml(channel.tagline)}</div>` : ''}
                        ${channel.description ? `
                        <details class="ch-description">
                            <summary>채널 소개 보기</summary>
                            <p>${WithPlus.escapeHtml(channel.description)}</p>
                        </details>` : ''}
                    </div>` : ''}`;
            }
            function attachHeaderHandlers() {
                const joinBtn = document.getElementById('ch-join-btn');
                if (joinBtn) joinBtn.addEventListener('click', async () => {
                    const session = await ensureLogin();
                    if (!session) return;
                    joinBtn.disabled = true;
                    try {
                        const res = await fetch(`/api/live/channels/${encodeURIComponent(slug)}/join`, {
                            method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + accessToken }, body: JSON.stringify({})
                        });
                        const json = await res.json();
                        if (res.ok && json.success) {
                            joinBtn.textContent = json.data.already_member ? '단골이에요 ✓' : '단골 완료 ✓';
                            if (!json.data.already_member) {
                                memberCount += 1;
                                const cEl = document.getElementById('ch-member-count');
                                if (cEl) cEl.textContent = `단골 ${memberCount.toLocaleString('ko-KR')}명`;
                            }
                        } else {
                            joinBtn.disabled = false;
                            alert(json.message || '단골 맺기에 실패했습니다');
                        }
                    } catch (err) {
                        joinBtn.disabled = false;
                        alert('단골 맺기 중 오류가 발생했습니다: ' + err.message);
                    }
                });
                const loginLink = document.getElementById('ch-login-link');
                WithPlus.getSession().then(session => {
                    if (session && loginLink) { loginLink.textContent = '마이페이지'; loginLink.setAttribute('href', '/mypage'); }
                });
            }
            renderHeader();
            attachHeaderHandlers();

            // 📹 방송 영상 동기화 - 모드/방(room)/재생주소가 실제로 바뀌었을 때만 다시 연결한다. 특히
            // WebRTC는 연결 객체(webrtcRoom)를 클로저에 계속 들고 있다가, 같은 세션이면 재연결 없이
            // 이미 구독 중인 트랙을 새 컨테이너에 다시 붙이기(attach)만 한다 - 네트워크 재협상이 없어 화면이
            // 끊기지 않는다.
            let webrtcRoom = null;
            let currentVideoKey = null;
            async function syncVideoHero() {
                const video = (liveSession && liveSession.video) || { mode: 'none' };
                const key = video.mode + '|' + (video.room || video.hls_url || video.embed_url || video.video_id || '');
                if (key === currentVideoKey) return; // 이전과 동일 - 아무것도 다시 그리지 않는다(재연결/재로딩 방지)
                currentVideoKey = key;

                if (webrtcRoom) { try { await webrtcRoom.disconnect(); } catch (e) {} webrtcRoom = null; }

                if (video.mode === 'none') { videoHeroStable.innerHTML = ''; return; }

                if (video.mode === 'webrtc') {
                    videoHeroStable.innerHTML = `<div class="video-hero-box"><span class="video-live-flag"><span class="dot"></span>LIVE</span><div id="webrtc-video-slot"></div></div>`;
                    try {
                        const tokRes = await fetch(`/api/live/channels/${encodeURIComponent(slug)}/sessions/${liveSession.id}/webrtc/viewer-token`);
                        const tokJson = await tokRes.json();
                        if (!tokRes.ok || !tokJson.success) return;
                        const room = new LivekitClient.Room();
                        webrtcRoom = room;
                        room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
                            if (track.kind === 'video' || track.kind === 'audio') {
                                const el = track.attach();
                                const slot = document.getElementById('webrtc-video-slot');
                                if (slot) { if (track.kind === 'video') el.setAttribute('playsinline', ''); el.muted = false; slot.appendChild(el); }
                            }
                        });
                        await room.connect(tokJson.data.livekit_url, tokJson.data.token);
                    } catch (err) { console.error('WebRTC 시청 연결 오류:', err); }
                    return;
                }

                if (video.mode === 'cloudflare_stream') {
                    videoHeroStable.innerHTML = `<div class="video-hero-box"><span class="video-live-flag"><span class="dot"></span>LIVE</span><video id="cf-stream-video" controls autoplay playsinline muted></video></div>`;
                    const vEl = document.getElementById('cf-stream-video');
                    if (vEl && vEl.canPlayType('application/vnd.apple.mpegurl')) {
                        vEl.src = video.hls_url;
                    } else if (window.Hls && window.Hls.isSupported()) {
                        const hls = new window.Hls();
                        hls.loadSource(video.hls_url);
                        hls.attachMedia(vEl);
                    } else if (vEl) {
                        vEl.src = video.hls_url; // 최선노력 폴백(hls.js 없이는 사파리 계열만 재생 가능)
                    }
                    return;
                }

                if (video.mode === 'youtube') {
                    videoHeroStable.innerHTML = `<div class="video-hero-box"><span class="video-live-flag"><span class="dot"></span>LIVE</span><iframe src="${WithPlus.escapeHtml(video.embed_url)}" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>`;
                    return;
                }
                if (video.mode === 'facebook') {
                    const fbUrl = encodeURIComponent(`https://www.facebook.com/video.php?v=${video.video_id}`);
                    videoHeroStable.innerHTML = `<div class="video-hero-box"><span class="video-live-flag"><span class="dot"></span>LIVE</span><iframe src="https://www.facebook.com/plugins/video.php?href=${fbUrl}&autoplay=true&mute=true" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>`;
                    return;
                }
            }

            // 세션별 가용재고(라이브 중일 때만 존재) - product_id -> available_qty
            let inventoryMap = {};
            async function refreshInventory() {
                if (!liveSession) { inventoryMap = {}; return; }
                try {
                    const res = await fetch(`/api/live/channels/${encodeURIComponent(slug)}/sessions/${liveSession.id}/inventory`);
                    const json = await res.json();
                    if (res.ok && json.success) {
                        inventoryMap = {};
                        (json.data || []).forEach(r => { inventoryMap[r.product_id] = r.available_qty; });
                    }
                } catch (err) { /* 조회 실패 시 이전 값 유지 */ }
            }
            await refreshInventory();

            // ⚡ 타임세일(플래시세일) - product_id -> { discount_price, original_price, ends_at }
            // 결제 검증은 서버(POST /api/orders)가 다시 하지만, 화면에는 지금 활성 상태인 세일만 표시한다.
            let flashSaleMap = {};
            async function refreshFlashSales() {
                if (!liveSession) { flashSaleMap = {}; return; }
                try {
                    const res = await fetch(`/api/live/channels/${encodeURIComponent(slug)}/sessions/${liveSession.id}/flash-sales`);
                    const json = await res.json();
                    if (res.ok && json.success) {
                        const map = {};
                        (json.data || []).forEach(f => { map[f.product_id] = f; });
                        flashSaleMap = map;
                    }
                } catch (err) { /* 조회 실패 시 이전 값 유지 */ }
            }
            await refreshFlashSales();

            // 🧠 실시간 퀴즈(매출견인기능 격차분석 2-4) - 정답 자체는 서버가 절대 내려주지 않는다(문제/정원/당첨자수만 공개).
            let activeQuiz = null;
            async function refreshActiveQuiz() {
                if (!liveSession) { activeQuiz = null; return; }
                try {
                    const res = await fetch(`/api/live/channels/${encodeURIComponent(slug)}/sessions/${liveSession.id}/quiz/active`);
                    const json = await res.json();
                    if (res.ok && json.success) activeQuiz = json.data;
                } catch (err) { /* 조회 실패 시 이전 값 유지 */ }
            }
            await refreshActiveQuiz();

            // accessToken은 원래 더 아래(장바구니/결제 상태 근처)에서 선언되지만, 아래 경매 기능이 로그인
            // 여부에 따라 낙찰 확인 API를 호출해야 해서 그보다 먼저 선언해둔다(TDZ 에러 방지).
            let accessToken = null;

            // 🔨 실시간 경매(경쟁사 기능 격차 백로그 5번) - 진행 중인 경매 또는 방금 끝난 경매(5분 이내) 1건
            let activeAuction = null;
            let myAuctionWin = null; // 내가 방금 끝난 경매의 낙찰자인 경우에만 채워짐(쿠폰 코드 포함, 본인전용 API)
            async function refreshActiveAuction() {
                if (!liveSession) { activeAuction = null; myAuctionWin = null; return; }
                try {
                    const res = await fetch(`/api/live/channels/${encodeURIComponent(slug)}/sessions/${liveSession.id}/auction/active`);
                    const json = await res.json();
                    const prevId = activeAuction ? activeAuction.id : null;
                    const prevStatus = activeAuction ? activeAuction.status : null;
                    activeAuction = (res.ok && json.success) ? json.data : null;
                    // 방금 진행중->종료로 바뀐 경매가 있으면(같은 id, 상태만 ended로 변경) 내가 낙찰자인지 확인
                    if (activeAuction && activeAuction.status === 'ended' && (activeAuction.id !== prevId || prevStatus !== 'ended') && accessToken) {
                        try {
                            const wRes = await fetch(`/api/live/channels/${encodeURIComponent(slug)}/sessions/${liveSession.id}/auction/${activeAuction.id}/my-result`, { headers: { Authorization: 'Bearer ' + accessToken } });
                            const wJson = await wRes.json();
                            if (wRes.ok && wJson.success && wJson.data.is_winner) myAuctionWin = wJson.data;
                        } catch (err) { /* 무시 */ }
                    }
                    if (!activeAuction) myAuctionWin = null;
                } catch (err) { /* 조회 실패 시 이전 값 유지 */ }
            }
            await refreshActiveAuction();

            // 🎤 라이트 멀티호스트(B8) - 지금 활동 중인 게스트 목록(배지/고정상품 노출용). 라이브 중일 때만 의미가 있다.
            let activeGuests = [];
            async function refreshActiveGuests() {
                if (!liveSession) { activeGuests = []; return; }
                try {
                    const res = await fetch(`/api/live/channels/${encodeURIComponent(slug)}/sessions/${liveSession.id}/guests`);
                    const json = await res.json();
                    if (res.ok && json.success) activeGuests = json.data || [];
                } catch (err) { /* 조회 실패 시 이전 값 유지 */ }
            }
            await refreshActiveGuests();

            // 🎟️ 선착순 다운로드 쿠폰함(경쟁사 기능 격차 백로그 7번) - 방송 중에만 받을 수 있는 한정수량 공개 쿠폰.
            let couponDrops = [];
            async function refreshCouponDrops() {
                if (!liveSession) { couponDrops = []; return; }
                try {
                    const headers = accessToken ? { Authorization: 'Bearer ' + accessToken } : {};
                    const res = await fetch(`/api/live/channels/${encodeURIComponent(slug)}/sessions/${liveSession.id}/coupon-drops`, { headers });
                    const json = await res.json();
                    if (res.ok && json.success) couponDrops = json.data;
                } catch (err) { /* 조회 실패 시 이전 값 유지 */ }
            }
            await refreshCouponDrops();

            // 🎁 라이브 전용 구매 캐시백율(네이버쇼핑라이브 "라이브적립금"과 동일 컨셉) - 관리자가 설정해두지
            // 않았으면 0%이므로 배지 자체를 표시하지 않는다. 방송 중에만 의미가 있으므로 한 번만 조회한다.
            let liveCashbackRate = 0;
            try {
                const res = await fetch('/api/settings/live-cashback-rate');
                const json = await res.json();
                if (res.ok && json.success) liveCashbackRate = Number(json.data.rate) || 0;
            } catch (err) { /* 실패 시 배지 없이 진행 */ }

            // 🎁 바이럴 공유쿠폰(소문내면 할인) 할인율 - 카카오톡딜 "소문내면 할인"과 동일 컨셉.
            // 관리자가 0%로 꺼두면 공유쿠폰 버튼 자체를 표시하지 않는다.
            let shareCouponDiscountPercent = 0;
            try {
                const res = await fetch('/api/settings/live-share-coupon');
                const json = await res.json();
                if (res.ok && json.success) shareCouponDiscountPercent = Number(json.data.discount_percent) || 0;
            } catch (err) { /* 실패 시 버튼 없이 진행 */ }

            // 👀 실시간 시청자 수 · 최근 구매 알림 (사회적 증명 - 틱톡/유튜브 라이브커머스 매출견인기능 격차분석 1번 항목)
            let viewerCount = 0;
            let recentPurchases = [];
            let viewerKey = null;
            try {
                viewerKey = localStorage.getItem('withplus_live_viewer_key');
                if (!viewerKey) {
                    viewerKey = 'v-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
                    localStorage.setItem('withplus_live_viewer_key', viewerKey);
                }
            } catch (e) { viewerKey = 'v-' + Math.random().toString(36).slice(2, 10); }

            async function refreshViewerStats() {
                if (!liveSession) { viewerCount = 0; recentPurchases = []; return; }
                try {
                    await fetch(`/api/live/channels/${encodeURIComponent(slug)}/sessions/${liveSession.id}/heartbeat`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ viewer_key: viewerKey })
                    });
                    const [cntRes, purRes] = await Promise.all([
                        fetch(`/api/live/channels/${encodeURIComponent(slug)}/sessions/${liveSession.id}/viewer-count`),
                        fetch(`/api/live/channels/${encodeURIComponent(slug)}/sessions/${liveSession.id}/recent-purchases`)
                    ]);
                    const cntJson = await cntRes.json();
                    if (cntRes.ok && cntJson.success) viewerCount = cntJson.data.viewer_count;
                    const purJson = await purRes.json();
                    if (purRes.ok && purJson.success) recentPurchases = purJson.data;
                } catch (err) { /* 실패해도 화면은 이전 값을 유지하며 조용히 무시 */ }
            }
            await refreshViewerStats();

            // 로컬 장바구니(=이 세션에서 만든 예약 목록). 새로고침하면 초기화되지만 서버의 예약 자체는
            // TTL이 지날 때까지 살아있다 - 페이지 하나에서 끝까지 진행하는 흐름을 우선 지원한다.
            let cart = []; // { reservation_id, product_id, name, price, quantity, expires_at }
            // cart에 담긴 예약들이 속한 세션 id. liveSession은 15초마다 폴링으로 갱신되는데, 그 사이 방송이
            // 끝나 liveSession이 null이 되어도(구매자 입장에서는 "방금 전까지 방송 중이었고 이미 예약도 해뒀는데
            // 화면에서 장바구니가 갑자기 사라지는" 나쁜 경험) 이미 만든 예약은 계속 결제까지 이어갈 수 있어야 하므로
            // liveSession과 별도로 붙잡아둔다.
            let cartSessionId = null;
            let checkoutMode = false;
            let orderResult = null;
            let paymentInProgress = false; // PG 결제 단계에 들어가면 true - 폴링에 의한 render() 재호출이 결제 화면을 덮어쓰지 않도록 막는다

            // 채팅 상태. cartSessionId와 비슷한 이유로 liveSession과 분리해서 붙잡아둔다 - 방송이 끝나도
            // 지나간 채팅 로그는 계속 보여줘야 하고(서버도 읽기는 항상 허용), 다음에 같은 채널이 다시 방송을
            // 시작하면(다른 세션 id) 그때는 로그를 새로 시작해야 한다.
            let chatSessionId = liveSession ? liveSession.id : null;
            let chatMessages = [];
            let chatLastCreatedAt = null;
            let chatSending = false;
            let chatHasMoreOlder = false; // 서버가 "더 오래된 메시지가 있을 수 있다"고 알려준 값 - "이전 메시지 더 보기" 버튼 표시 여부
            let chatLoadingOlder = false;

            // 🎁 실시간 가상 선물/후원(경쟁사 기능 격차 백로그 6번) - 카탈로그는 방송마다 바뀌지 않으므로 한 번만 불러온다.
            let giftCatalog = [];
            let giftPickerOpen = false;
            let giftSending = false;
            async function loadGiftCatalog() {
                try {
                    const res = await fetch('/api/settings/live-gift-catalog');
                    const json = await res.json();
                    if (res.ok && json.success) giftCatalog = json.data;
                } catch (err) { /* 카탈로그 로드 실패해도 선물 버튼만 숨겨지고 나머지는 정상 동작 */ }
            }
            function giftPickerHtml() {
                if (giftCatalog.length === 0) return '';
                const items = giftCatalog.map(g => `<div class="gift-item" data-gift-key="${WithPlus.escapeHtml(g.key)}"><span class="g-emoji">${g.emoji}</span><span class="g-label">${WithPlus.escapeHtml(g.label)}</span><span class="g-cost">${Number(g.cost).toLocaleString('ko-KR')}P</span></div>`).join('');
                return `<div class="gift-picker" id="gift-picker"><div class="gift-balance" id="gift-balance-note">보유 마일리지를 사용해 선물을 보낼 수 있어요</div>${items}</div>`;
            }
            async function sendGift(giftKey) {
                if (giftSending) return;
                const session = await ensureLogin();
                if (!session) return;
                giftSending = true;
                try {
                    const res = await fetch(`/api/live/channels/${encodeURIComponent(slug)}/sessions/${chatSessionId}/gifts`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + accessToken },
                        body: JSON.stringify({ giftKey })
                    });
                    const json = await res.json();
                    if (res.ok && json.success) {
                        if (json.data.chat_message) appendChatMessages([json.data.chat_message]);
                        const balNote = document.getElementById('gift-balance-note');
                        if (balNote) balNote.textContent = `보유 마일리지: ${Number(json.data.remaining_balance).toLocaleString('ko-KR')}P`;
                    } else {
                        alert(json.error || '선물 전송에 실패했습니다');
                    }
                } catch (err) {
                    alert('선물 전송 중 오류가 발생했습니다: ' + err.message);
                } finally {
                    giftSending = false;
                }
            }

            async function ensureLogin() {
                const session = await WithPlus.getSession();
                if (!session) {
                    location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search);
                    return null;
                }
                accessToken = await WithPlus.getAccessToken();
                return session;
            }

            function fmtPrice(n) { return Number(n || 0).toLocaleString('ko-KR') + '원'; }
            // 서버가 채널가격정책(라이브 채널)을 반영해 계산한 live_price가 있으면 그걸 실제 판매가로 쓰고,
            // 없으면(원가 미입력 등으로 계산이 안 된 경우) 기존처럼 discount_price||price를 쓴다.
            // 타임세일이 지금 활성 상태인 상품이면 그 어떤 가격보다 우선한다(서버 결제 로직과 동일한 우선순위).
            function effectivePrice(p) {
                const fs = p && flashSaleMap[p.id];
                if (fs) return Number(fs.discount_price) || 0;
                return (p && typeof p.live_price === 'number') ? p.live_price : ((p && p.discount_price) || (p && p.price) || 0);
            }
            function flashSaleCountdownLabel(endsAt) {
                const ms = new Date(endsAt).getTime() - Date.now();
                if (ms <= 0) return '곧 종료';
                const m = Math.floor(ms / 60000);
                const s = Math.floor((ms % 60000) / 1000);
                return `${m}:${String(s).padStart(2, '0')}`;
            }

            function timeLeftLabel(expiresAt) {
                const ms = new Date(expiresAt).getTime() - Date.now();
                if (ms <= 0) return '만료됨';
                const m = Math.floor(ms / 60000);
                const s = Math.floor((ms % 60000) / 1000);
                return `${m}:${String(s).padStart(2, '0')} 남음`;
            }

            function showQuizWinToast(quizResult) {
                const rewardTxt = quizResult.discount_type === 'percent' ? `${quizResult.discount_value}% 할인` : `${Number(quizResult.discount_value).toLocaleString('ko-KR')}원 할인`;
                const toast = document.createElement('div');
                toast.className = 'quiz-win-toast';
                toast.innerHTML = `🎉 정답입니다! 쿠폰 <strong>${WithPlus.escapeHtml(quizResult.coupon_code)}</strong> 발급 (${rewardTxt}) — 결제 시 쿠폰코드로 사용하세요`;
                document.body.appendChild(toast);
                setTimeout(() => { toast.style.opacity = '0'; }, 4000);
                setTimeout(() => { toast.remove(); }, 4600);
            }

            function chatMsgHtml(m) {
                // 🎁 선물 메시지는 서버에서 "이모지 + 닉네임 + 선물했습니다!" 형태로 이미 완성해서 보내주므로
                // 이름을 따로 앞에 또 붙이지 않고 통째로 강조 스타일만 입혀서 보여준다.
                if (m.message_type === 'gift') {
                    return `<div class="chat-msg gift-msg">${WithPlus.escapeHtml(m.message)}</div>`;
                }
                const quizBadge = m.message_type === 'quiz_correct' ? '<span class="quiz-correct-badge">🎉 정답!</span> ' : '';
                const guestBadge = m.is_guest ? '<span class="guest-badge">🎤 게스트</span> ' : '';
                return `<div class="chat-msg${m.is_mine ? ' mine' : ''}">${quizBadge}${guestBadge}<span class="chat-name">${WithPlus.escapeHtml(m.display_name)}</span>${WithPlus.escapeHtml(m.message)}</div>`;
            }

            // 새 메시지를 상태 배열에도 반영하고(다음 전체 render() 때 정확한 내용이 나오도록), 이미 그려져 있는
            // #chat-log에도 직접 이어붙인다(전체 re-render 없이) - 매번 통째로 다시 그리면 3초마다 스크롤 위치가
            // 튀는 나쁜 경험이 생긴다.
            function appendChatMessages(newMsgs) {
                if (!newMsgs || newMsgs.length === 0) return;
                const existingIds = new Set(chatMessages.map(m => m.id));
                const toAdd = newMsgs.filter(m => !existingIds.has(m.id));
                if (toAdd.length === 0) return;
                chatMessages = chatMessages.concat(toAdd);
                chatLastCreatedAt = chatMessages[chatMessages.length - 1].created_at;

                const logEl = document.getElementById('chat-log');
                if (!logEl) return; // 채팅 섹션이 화면에 없는 상태(예: 아직 한 번도 방송이 없었음)면 DOM 갱신은 건너뜀
                const wasNearBottom = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 40;
                const emptyNote = logEl.querySelector('.chat-empty');
                if (emptyNote) emptyNote.remove();
                logEl.insertAdjacentHTML('beforeend', toAdd.map(chatMsgHtml).join(''));
                if (wasNearBottom) logEl.scrollTop = logEl.scrollHeight;
            }

            async function loadChatMessages() {
                if (!chatSessionId) return;
                try {
                    const headers = accessToken ? { Authorization: 'Bearer ' + accessToken } : {};
                    const res = await fetch(`/api/live/channels/${encodeURIComponent(slug)}/sessions/${chatSessionId}/chat`, { headers });
                    const json = await res.json();
                    if (res.ok && json.success) {
                        chatMessages = json.data;
                        chatLastCreatedAt = chatMessages.length > 0 ? chatMessages[chatMessages.length - 1].created_at : null;
                        chatHasMoreOlder = !!json.has_more;
                    }
                } catch (err) { /* 초기 로드 실패해도 빈 채팅창으로 계속 진행 */ }
            }

            // "이전 메시지 더 보기" - 지금 화면에 있는 가장 오래된 메시지보다 앞선 메시지를 가져와 위쪽에 이어붙인다.
            // 스크롤 위치는 사용자가 보고 있던 지점이 그대로 유지되도록 늘어난 높이만큼 같이 밀어준다.
            async function loadOlderChatMessages() {
                if (chatLoadingOlder || !chatHasMoreOlder || chatMessages.length === 0) return;
                chatLoadingOlder = true;
                const btn = document.getElementById('chat-load-older-btn');
                if (btn) { btn.disabled = true; btn.textContent = '불러오는 중...'; }
                try {
                    const oldest = chatMessages[0].created_at;
                    const headers = accessToken ? { Authorization: 'Bearer ' + accessToken } : {};
                    const res = await fetch(`/api/live/channels/${encodeURIComponent(slug)}/sessions/${chatSessionId}/chat?before=${encodeURIComponent(oldest)}`, { headers });
                    const json = await res.json();
                    if (res.ok && json.success) {
                        chatHasMoreOlder = !!json.has_more;
                        const logEl = document.getElementById('chat-log');
                        if (json.data.length > 0) {
                            chatMessages = json.data.concat(chatMessages);
                            if (logEl) {
                                const prevScrollHeight = logEl.scrollHeight;
                                const prevScrollTop = logEl.scrollTop;
                                const html = json.data.map(chatMsgHtml).join('');
                                if (btn) btn.insertAdjacentHTML('afterend', html); else logEl.insertAdjacentHTML('afterbegin', html);
                                logEl.scrollTop = prevScrollTop + (logEl.scrollHeight - prevScrollHeight);
                            }
                        }
                        if (btn) {
                            if (chatHasMoreOlder && json.data.length > 0) { btn.disabled = false; btn.textContent = '이전 메시지 더 보기'; }
                            else btn.remove();
                        }
                    } else if (btn) {
                        btn.disabled = false; btn.textContent = '이전 메시지 더 보기';
                    }
                } catch (err) {
                    const btn2 = document.getElementById('chat-load-older-btn');
                    if (btn2) { btn2.disabled = false; btn2.textContent = '이전 메시지 더 보기'; }
                } finally {
                    chatLoadingOlder = false;
                }
            }

            async function pollChatMessages() {
                if (!chatSessionId) return;
                try {
                    const headers = accessToken ? { Authorization: 'Bearer ' + accessToken } : {};
                    const qs = chatLastCreatedAt ? `?after=${encodeURIComponent(chatLastCreatedAt)}` : '';
                    const res = await fetch(`/api/live/channels/${encodeURIComponent(slug)}/sessions/${chatSessionId}/chat${qs}`, { headers });
                    const json = await res.json();
                    if (res.ok && json.success) appendChatMessages(json.data);
                } catch (err) { /* 폴링 실패는 조용히 무시하고 다음 주기에 재시도 */ }
            }

            function renderChatSection() {
                if (!chatSessionId) return '';
                const loadOlderBtn = chatHasMoreOlder ? '<button type="button" id="chat-load-older-btn" class="chat-load-older-btn">이전 메시지 더 보기</button>' : '';
                const logInner = chatMessages.length > 0
                    ? loadOlderBtn + chatMessages.map(chatMsgHtml).join('')
                    : '<div class="chat-empty">아직 채팅이 없습니다. 첫 메시지를 남겨보세요!</div>';
                const inputRow = liveSession
                    ? `<div class="chat-input-row">
                        <input type="text" id="chat-input" placeholder="채팅을 입력하세요" maxlength="200">
                        <button type="button" id="chat-send-btn">전송</button>
                        <button type="button" id="gift-toggle-btn" class="gift-send-btn">🎁 선물</button>
                       </div>
                       ${giftPickerHtml()}
                       <div style="text-align:right; margin-top:4px;"><a href="#" id="guest-redeem-link" style="font-size:0.72em; color:var(--text-gray);">🎤 게스트이신가요? 초대코드 입력</a></div>`
                    : `<div class="chat-offline-note">방송이 종료되어 더 이상 채팅을 보낼 수 없습니다</div>`;
                const quizBannerHtml = (liveSession && activeQuiz) ? `
                    <div class="quiz-banner" id="quiz-banner">
                        <div class="q-title">🧠 퀴즈! ${WithPlus.escapeHtml(activeQuiz.question)}</div>
                        <div class="q-progress">채팅에 정답을 입력하면 쿠폰 획득! (선착순 ${activeQuiz.winner_limit}명 중 <span id="quiz-progress-count">${activeQuiz.winner_count}</span>명 당첨됨)</div>
                    </div>` : '';
                return `
                    <div class="chat-section">
                        <div class="chat-header">💬 실시간 채팅</div>
                        ${quizBannerHtml}
                        <div class="chat-log" id="chat-log">${logInner}</div>
                        ${inputRow}
                    </div>`;
            }

            async function sendChatMessage() {
                const input = document.getElementById('chat-input');
                if (!input || chatSending) return;
                const message = input.value.trim();
                if (!message) return;
                const session = await ensureLogin();
                if (!session) return;
                chatSending = true;
                const sendBtn = document.getElementById('chat-send-btn');
                if (sendBtn) sendBtn.disabled = true;
                try {
                    const res = await fetch(`/api/live/channels/${encodeURIComponent(slug)}/sessions/${chatSessionId}/chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + accessToken },
                        body: JSON.stringify({ message })
                    });
                    const json = await res.json();
                    if (res.ok && json.success) {
                        input.value = '';
                        appendChatMessages([json.data]);
                        if (json.data.quiz_result && json.data.quiz_result.correct) {
                            showQuizWinToast(json.data.quiz_result);
                            await refreshActiveQuiz();
                            const progressEl = document.getElementById('quiz-progress-count');
                            if (progressEl && activeQuiz) progressEl.textContent = activeQuiz.winner_count;
                            if (!activeQuiz) {
                                const bannerEl = document.getElementById('quiz-banner');
                                if (bannerEl) bannerEl.remove(); // 정원이 차 퀴즈가 자동 종료된 경우 배너도 함께 제거
                            }
                        }
                    } else if (res.status === 429) {
                        // 도배 방지 레이트리밋 - 조용히 무시(입력값은 남겨둬서 잠시 후 다시 누르면 됨)
                    } else {
                        alert(json.message || '채팅 전송에 실패했습니다');
                    }
                } catch (err) {
                    alert('채팅 전송 중 오류가 발생했습니다: ' + err.message);
                } finally {
                    chatSending = false;
                    if (sendBtn) sendBtn.disabled = false;
                }
            }

            async function reserveProduct(product, qty, stage) {
                const session = await ensureLogin();
                if (!session) return null;
                try {
                    const res = await fetch(`/api/live/channels/${encodeURIComponent(slug)}/sessions/${liveSession.id}/reservations`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + accessToken },
                        body: JSON.stringify({ product_id: product.id, quantity: qty, stage: stage || 'cart' })
                    });
                    const json = await res.json();
                    if (!res.ok || !json.success) {
                        alert(json.message || '재고 예약에 실패했습니다');
                        await refreshInventory();
                        render();
                        return null;
                    }
                    if (typeof json.data.available_qty === 'number') inventoryMap[product.id] = json.data.available_qty;
                    return json.data;
                } catch (err) {
                    alert('예약 중 오류가 발생했습니다: ' + err.message);
                    return null;
                }
            }

            async function cancelReservation(item) {
                try {
                    await fetch(`/api/live/channels/${encodeURIComponent(slug)}/sessions/${cartSessionId}/reservations/${item.reservation_id}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + accessToken },
                        body: JSON.stringify({ action: 'cancel' })
                    });
                } catch (err) { /* 실패해도 목록에서는 제거 - 서버는 만료 시 어차피 정리된다 */ }
                cart = cart.filter(c => c.reservation_id !== item.reservation_id);
                if (cart.length === 0) cartSessionId = null;
                await refreshInventory();
                render();
            }

            document.getElementById('cart-detail-toggle-handler') // no-op placeholder to keep structure explicit
            let cartOpen = false;

            function pinnedProduct() {
                if (!liveSession || !liveSession.pinned_product_id) return null;
                return products.find(p => p.id === liveSession.pinned_product_id) || liveSession.products_with || null;
            }

            // 🗂️ 카테고리 아이콘 행 - 이 채널의 상품 목록(products)에 실제로 존재하는 카테고리만 뽑아서 보여준다.
            // products는 초기 1회만 불러오고 폴링 중에는 다시 불러오지 않으므로(방송 도중 상품 구성이 거의
            // 안 바뀐다는 전제), 매번 다시 계산해도 비용이 크지 않다.
            let selectedCategory = null; // null = 전체
            function activeCategories() {
                const seen = [];
                products.forEach(p => { if (p.category && !seen.includes(p.category)) seen.push(p.category); });
                return seen;
            }
            function categoryLabel(dbCategory) {
                const raw = (WithPlus.getCategoriesRawCached() || []).find(c => c.db_category === dbCategory);
                return raw ? raw.label : dbCategory;
            }
            function categoryRowHtml() {
                const cats = activeCategories();
                if (cats.length < 2) return ''; // 카테고리가 1개 이하면 필터링 자체가 의미 없으므로 행을 아예 표시하지 않는다
                const allBtn = `<button type="button" class="category-icon-item${selectedCategory === null ? ' active' : ''}" data-category="">
                    <span class="ci-emoji">🛍️</span><span class="ci-label">전체</span>
                </button>`;
                const catBtns = cats.map(c => `
                    <button type="button" class="category-icon-item${selectedCategory === c ? ' active' : ''}" data-category="${WithPlus.escapeHtml(c)}">
                        <span class="ci-emoji">${WithPlus.getCategoryEmoji(c)}</span><span class="ci-label">${WithPlus.escapeHtml(categoryLabel(c))}</span>
                    </button>`).join('');
                return `<div class="category-icon-row">${allBtn}${catBtns}</div>`;
            }

            function productCardHtml(p, opts) {
                opts = opts || {};
                const avail = liveSession ? inventoryMap[p.id] : undefined;
                const hasInventoryRow = typeof avail === 'number';
                const displayPrice = effectivePrice(p);
                const fs = flashSaleMap[p.id];
                const pinFlag = opts.pinned ? '<div class="pin-flag">📌 지금 소개중</div>' : '';
                const flashFlag = fs ? `<div class="flash-flag" data-flash-flag="${p.id}">⚡ <span data-flash-timer="${p.id}">${flashSaleCountdownLabel(fs.ends_at)}</span></div>` : '';
                const img = (p.images_urls && p.images_urls[0]) ? p.images_urls[0] : '';
                let availHtml = '';
                let actionHtml = '';
                if (liveSession && hasInventoryRow) {
                    availHtml = `<div class="avail ${avail <= 3 ? 'low' : ''}">${avail > 0 ? `방송 재고 ${avail}개 남음` : '방송 재고 소진'}</div>`;
                    const qtyId = `qty-${p.id}`;
                    actionHtml = avail > 0 ? `
                        <div class="qty-row">
                            <button type="button" data-qty-dec="${p.id}">−</button>
                            <span class="qty-val" id="${qtyId}">1</span>
                            <button type="button" data-qty-inc="${p.id}">+</button>
                        </div>
                        <button type="button" class="buy-btn" data-cart-add="${p.id}">장바구니 예약</button>
                        <button type="button" class="buy-btn secondary" data-buy-now="${p.id}">바로 구매</button>
                    ` : `<button type="button" class="buy-btn" disabled>품절</button>`;
                } else {
                    availHtml = liveSession ? '' : `<div class="avail">재고 ${p.stock ?? '-'}개</div>`;
                    actionHtml = `<a href="/product/${p.id}" style="text-decoration:none;"><button type="button" class="buy-btn">상품 보기</button></a>`;
                }
                return `
                    <div class="product-card">
                        <div class="thumb" style="${img ? `background-image:url('${WithPlus.escapeHtml(img)}');` : ''}">${pinFlag}${flashFlag}</div>
                        <div class="body">
                            <div class="name">${WithPlus.escapeHtml(p.name)}</div>
                            <div class="price price-row">${fmtPrice(displayPrice)}${fs ? `<span class="orig-price">${fmtPrice(fs.original_price || p.price)}</span>` : ''}</div>
                            ${availHtml}
                            ${actionHtml}
                        </div>
                    </div>`;
            }

            // 결제(PG) 연동이 켜져있을 때 - cart.html의 renderPaymentStep과 동일한 방식(카카오페이/네이버페이는
            // 서버가 만들어준 결제창 URL로 이동, 토스는 위젯 렌더링)으로 실제 결제 단계를 보여준다.
            // 라이브 주문도 일반 장바구니 주문과 동일하게 "주문 접수 ≠ 결제 완료"이므로 PG가 켜져있으면 반드시 이 단계를 거쳐야 한다.
            async function renderLivePaymentStep(order, pgConfigs, customerInfo) {
                paymentInProgress = true;
                const methods = [];
                if (pgConfigs.kakaopay && pgConfigs.kakaopay.enabled) methods.push({ key: 'kakaopay', label: '🟡 카카오페이로 결제' });
                if (pgConfigs.naverpay && pgConfigs.naverpay.enabled) methods.push({ key: 'naverpay', label: '🟢 네이버페이로 결제' });
                if (pgConfigs.toss && pgConfigs.toss.enabled && pgConfigs.toss.clientKey) methods.push({ key: 'toss', label: '💳 신용카드 등(토스페이먼츠)' }); // 키 등록 전에는 숨김

                root.innerHTML = `
                    <div class="order-complete">
                        <h2>주문이 접수되었습니다</h2>
                        <p>주문번호: ${WithPlus.escapeHtml(order.order_number)} · 결제 금액 ${fmtPrice(order.final_price)}</p>
                        <p style="font-size:0.8em;">아래에서 결제를 완료해야 주문이 최종 확정됩니다.</p>
                        <div id="pay-method-select" style="max-width:420px; margin:16px auto 0; display:flex; flex-direction:column; gap:8px;">
                            ${methods.map(m => `<button type="button" class="submit-btn pay-method-btn" data-method="${m.key}" style="background:#fff; color:var(--text-dark); border:1px solid var(--border-color);">${m.label}</button>`).join('')}
                        </div>
                        <div id="toss-payment-method" style="text-align:left; max-width:420px; margin:16px auto 0; display:none;"></div>
                        <div id="toss-agreement" style="text-align:left; max-width:420px; margin:10px auto; display:none;"></div>
                        <button type="button" id="toss-pay-btn" class="submit-btn" style="max-width:420px; margin:16px auto 0; display:none;">${fmtPrice(order.final_price)} 결제하기</button>
                        <div class="msg" id="toss-pay-msg" style="max-width:420px; margin:10px auto 0;"></div>
                    </div>`;

                const msg = document.getElementById('toss-pay-msg');
                let tossWidget = null;

                async function payWithRedirectPg(method) {
                    const btns = document.querySelectorAll('.pay-method-btn');
                    btns.forEach(b => b.disabled = true);
                    msg.className = 'msg';
                    msg.textContent = '결제창을 준비하는 중입니다...';
                    try {
                        const endpoint = method === 'kakaopay' ? `/api/orders/${order.id}/kakaopay/ready` : `/api/orders/${order.id}/naverpay/reserve`;
                        const res = await fetch(endpoint, { method: 'POST', headers: { Authorization: 'Bearer ' + accessToken } });
                        const json = await res.json();
                        if (!res.ok || !json.success) throw new Error(json.message || '결제창 준비에 실패했습니다');
                        if (method === 'kakaopay') {
                            const isMobile = /Mobi|Android/i.test(navigator.userAgent);
                            location.href = (isMobile && json.data.redirect_url_mobile) ? json.data.redirect_url_mobile : json.data.redirect_url;
                        } else {
                            location.href = `https://npay.naver.com/pay/${json.data.mode === 'live' ? '' : 'test/'}${json.data.reserve_id}`;
                        }
                    } catch (err) {
                        msg.textContent = '결제 진행 중 오류가 발생했습니다: ' + (err.message || err);
                        msg.className = 'msg error';
                        btns.forEach(b => b.disabled = false);
                    }
                }

                async function showTossWidget() {
                    document.getElementById('toss-payment-method').style.display = 'block';
                    document.getElementById('toss-agreement').style.display = 'block';
                    document.getElementById('toss-pay-btn').style.display = 'block';

                    if (!document.getElementById('toss-sdk-script')) {
                        await new Promise((resolve, reject) => {
                            const s = document.createElement('script');
                            s.id = 'toss-sdk-script';
                            s.src = 'https://js.tosspayments.com/v1/payment-widget';
                            s.onload = resolve;
                            s.onerror = () => reject(new Error('토스페이먼츠 결제 위젯 스크립트를 불러오지 못했습니다'));
                            document.head.appendChild(s);
                        });
                    }

                    tossWidget = PaymentWidget(pgConfigs.toss.clientKey, customerInfo.userId || PaymentWidget.ANONYMOUS);
                    tossWidget.renderPaymentMethods('#toss-payment-method', { value: order.final_price });
                    tossWidget.renderAgreement('#toss-agreement');
                }

                document.querySelectorAll('.pay-method-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const method = btn.dataset.method;
                        if (method === 'toss') { await showTossWidget(); return; }
                        await payWithRedirectPg(method);
                    });
                });

                if (methods.length === 1 && methods[0].key === 'toss') await showTossWidget();

                document.getElementById('toss-pay-btn').addEventListener('click', async () => {
                    try {
                        await tossWidget.requestPayment({
                            orderId: order.order_number,
                            orderName: `WITH+ 라이브 주문 (${order.order_number})`,
                            successUrl: location.origin + '/payment-result.html',
                            failUrl: location.origin + '/payment-result.html',
                            customerEmail: customerInfo.email || undefined,
                            customerName: customerInfo.name || undefined,
                            customerMobilePhone: (customerInfo.phone || '').replace(/[^0-9]/g, '') || undefined
                        });
                    } catch (err) {
                        msg.textContent = '결제 진행 중 오류가 발생했습니다: ' + (err.message || err);
                        msg.className = 'msg error';
                    }
                });
            }

            function render() {
                const pinned = pinnedProduct();
                const otherProducts = products.filter(p => !pinned || p.id !== pinned.id);

                if (orderResult) {
                    root.innerHTML = `
                        <div class="order-complete">
                            <div class="emoji">🎉</div>
                            <h2>주문이 완료되었습니다</h2>
                            <p>주문번호: ${WithPlus.escapeHtml(orderResult.order_number || orderResult.id)}</p>
                            <p>결제 예정 금액: ${fmtPrice(orderResult.final_price ?? orderResult.total_amount)}</p>
                            <a href="/mypage">마이페이지에서 주문 확인 →</a><br>
                            <a href="/live/${encodeURIComponent(slug)}">방송으로 돌아가기 →</a>
                        </div>`;
                    return;
                }

                const liveHtml = liveSession ? `
                    <div class="live-banner">
                        <span class="live-tag"><span class="dot"></span>LIVE</span>
                        <span class="viewer-count-badge">👀 ${viewerCount.toLocaleString('ko-KR')}명 시청 중</span>
                        ${liveCashbackRate > 0 ? `<span class="viewer-count-badge">🎁 지금 구매 시 ${Math.round(liveCashbackRate * 100)}% 추가 적립</span>` : ''}
                        <h2>${WithPlus.escapeHtml(liveSession.title || channel.name + ' 방송')}</h2>
                        <div class="live-meta">지금 방송 중 · 시청 중인 상품이 실시간으로 바뀝니다</div>
                        ${recentPurchases.length > 0 ? `<div class="recent-purchase-ticker">🛒 ${WithPlus.escapeHtml(recentPurchases[0].buyer_name)}님이 방금 ${WithPlus.escapeHtml(recentPurchases[0].product_name)} 구매</div>` : ''}
                    </div>
                    ${pinned ? (() => {
                        const pfs = flashSaleMap[pinned.id];
                        // 방송 중에만 적용되는 채널가격정책(live_price)이 평소 판매가보다 낮을 때 "라이브 전용가" 배지를 보여준다.
                        const normalPrice = pinned.discount_price || pinned.price || 0;
                        const isLiveOnlyDeal = !pfs && typeof pinned.live_price === 'number' && pinned.live_price < normalPrice;
                        const liveOnlyFlag = isLiveOnlyDeal ? '<div class="live-only-flag">🔥 라이브 전용가</div>' : '';
                        return `
                    <div class="pinned-card">
                        <div class="thumb" style="${(pinned.images_urls && pinned.images_urls[0]) ? `background-image:url('${WithPlus.escapeHtml(pinned.images_urls[0])}');` : ''}">${pfs ? `<div class="flash-flag" data-flash-flag="${pinned.id}">⚡ <span data-flash-timer="${pinned.id}">${flashSaleCountdownLabel(pfs.ends_at)}</span></div>` : liveOnlyFlag}</div>
                        <div class="info">
                            <div class="pin-label">📌 지금 소개중인 상품</div>
                            <div class="name">${WithPlus.escapeHtml(pinned.name)}</div>
                            <div class="price price-row">${fmtPrice(effectivePrice(pinned))}${pfs ? `<span class="orig-price">${fmtPrice(pfs.original_price || pinned.price)}</span>` : (isLiveOnlyDeal ? `<span class="orig-price">${fmtPrice(normalPrice)}</span>` : '')}</div>
                            <div class="stock-note">${typeof inventoryMap[pinned.id] === 'number' ? (inventoryMap[pinned.id] > 0 ? `방송 재고 ${inventoryMap[pinned.id]}개 남음` : '방송 재고 소진') : ''}</div>
                        </div>
                    </div>`;
                    })() : ''}
                ` : (replaySession ? `
                    <div class="replay-banner">
                        <span class="replay-tag">📼 다시보기</span>
                        <h2>${WithPlus.escapeHtml(replaySession.title || channel.name + ' 방송')}</h2>
                        <div class="live-meta">지난 방송 다시보기 · 아래 상품은 평소처럼 둘러보고 구매하실 수 있어요</div>
                        ${replaySession.replay_links && replaySession.replay_links.length > 0 ? `
                        <div class="replay-links">
                            ${replaySession.replay_links.map(l => `<a href="${WithPlus.escapeHtml(l.url)}" target="_blank" rel="noopener">${l.platform === 'youtube' ? '▶️ 유튜브' : '▶️ 페이스북'}에서 다시보기</a>`).join('')}
                        </div>` : `<div class="live-meta" style="margin-top:4px;">이 방송의 다시보기 영상은 아직 준비되지 않았습니다.</div>`}
                        ${replaySession.highlights && replaySession.highlights.length > 0 ? `
                        <div class="replay-highlights">
                            <div class="highlights-label">🔥 채팅이 몰렸던 구간(하이라이트 후보)</div>
                            <div class="highlight-list">
