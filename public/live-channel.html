                                ${replaySession.highlights.map(h => `<a href="${WithPlus.escapeHtml(h.youtube_url || '#')}" target="_blank" rel="noopener">${Math.floor(h.offset_seconds / 60)}:${String(h.offset_seconds % 60).padStart(2, '0')}</a>`).join('')}
                            </div>
                        </div>` : ''}
                    </div>
                ` : `<div class="offline-banner">현재 방송 중이 아닙니다. 아래 상품은 평소처럼 둘러보고 구매하실 수 있어요.</div>`);

                // 🔨 실시간 경매(경쟁사 기능 격차 백로그 5번) - 진행중이면 입찰 UI, 방금 끝났고 내가 낙찰자면 축하 배너
                let auctionHtml = '';
                if (activeAuction && (activeAuction.status === 'open' || activeAuction.status === 'finalizing')) {
                    const minNext = Number(activeAuction.current_price) + Number(activeAuction.bid_increment);
                    const msLeft = Math.max(0, new Date(activeAuction.ends_at).getTime() - Date.now());
                    const secLeft = Math.ceil(msLeft / 1000);
                    auctionHtml = `
                    <div class="auction-banner" id="auction-banner" data-ends-at="${WithPlus.escapeHtml(activeAuction.ends_at)}">
                        <div class="a-title">🔨 실시간 경매 · ${WithPlus.escapeHtml(activeAuction.title)}</div>
                        <div class="a-price">현재가 <strong>${activeAuction.current_price.toLocaleString('ko-KR')}원</strong> <span class="a-count">(입찰 ${activeAuction.bid_count}건)</span></div>
                        <div class="a-timer" id="auction-timer">⏱ 남은 시간 <span id="auction-timer-sec">${secLeft}</span>초</div>
                        <div class="a-bid-row">
                            <input type="number" id="auction-bid-input" value="${minNext}" min="${minNext}" step="${activeAuction.bid_increment}">
                            <button type="button" id="auction-bid-btn">입찰하기</button>
                        </div>
                        <div class="msg" id="auction-bid-msg"></div>
                    </div>`;
                } else if (activeAuction && activeAuction.status === 'ended' && myAuctionWin && myAuctionWin.is_winner) {
                    auctionHtml = `
                    <div class="auction-banner auction-won">
                        <div class="a-title">🏆 경매 낙찰을 축하합니다!</div>
                        <div class="a-price">${WithPlus.escapeHtml(activeAuction.title)}을(를) <strong>${myAuctionWin.winning_price.toLocaleString('ko-KR')}원</strong>에 낙찰받으셨어요.</div>
                        <div class="a-timer">24시간 안에 쿠폰을 사용해 결제를 완료해주세요.</div>
                        <a href="/mypage.html" class="a-mypage-link">마이페이지에서 쿠폰 확인하기 →</a>
                    </div>`;
                } else if (activeAuction && activeAuction.status === 'ended') {
                    auctionHtml = `
                    <div class="auction-banner auction-ended">
                        <div class="a-title">🔨 경매가 종료되었습니다 · ${WithPlus.escapeHtml(activeAuction.title)}</div>
                        <div class="a-price">최종 낙찰가 ${activeAuction.current_price.toLocaleString('ko-KR')}원</div>
                    </div>`;
                }

                // 🎟️ 선착순 다운로드 쿠폰함(경쟁사 기능 격차 백로그 7번) - 수량이 남아있는 것만 눈에 띄게 보여준다
                const couponDropsHtml = (liveSession && couponDrops.length > 0) ? `
                    <div class="coupon-drop-banner">
                        <div class="cd-title">🎟️ 지금 이 방송에서만 받을 수 있는 특가 쿠폰</div>
                        ${couponDrops.map(c => {
                            const soldOut = c.remaining <= 0;
                            const discountTxt = c.discount_type === 'percent' ? `${c.discount_value}% 할인` : `${Number(c.discount_value).toLocaleString('ko-KR')}원 할인`;
                            const btnLabel = c.already_claimed ? '다운로드 완료 ✅' : (soldOut ? '품절' : '받기');
                            return `
                            <div class="cd-item">
                                <div class="cd-info">
                                    <div class="cd-label">${WithPlus.escapeHtml(c.label)} <span class="cd-discount">${discountTxt}</span></div>
                                    <div class="cd-remain">${soldOut ? '모두 소진되었습니다' : `${c.remaining}장 남음 (전체 ${c.claim_limit}장)`}</div>
                                </div>
                                <button type="button" class="cd-claim-btn" data-coupon-id="${c.id}" ${(c.already_claimed || soldOut) ? 'disabled' : ''}>${btnLabel}</button>
                            </div>`;
                        }).join('')}
                    </div>` : '';

                const guestPinnedHtml = (liveSession && activeGuests.length > 0)
                    ? activeGuests.filter(g => g.pinned_product).map(g => `
                        <div class="guest-pinned-card">
                            <span class="guest-tag">🎤 ${WithPlus.escapeHtml(g.guest_name)} 게스트 추천</span>
                            <span>${WithPlus.escapeHtml(g.pinned_product.name)} · ${fmtPrice(g.pinned_product.price)}</span>
                        </div>`).join('')
                    : '';

                const gridProductsAll = pinned ? otherProducts : products;
                const gridProducts = selectedCategory ? gridProductsAll.filter(p => p.category === selectedCategory) : gridProductsAll;
                const productsHtml = gridProducts.length > 0
                    ? `<div class="section-title">${liveSession ? '함께 소개된 상품' : '판매 상품'}</div><div class="product-grid">${gridProducts.map(p => productCardHtml(p)).join('')}</div>`
                    : (pinned ? '' : `<div class="state-box"><div class="emoji">🛍️</div><h3>${selectedCategory ? '이 카테고리에는 상품이 없습니다' : '아직 등록된 상품이 없습니다'}</h3></div>`);
                const pinnedGridHtml = pinned ? `<div class="section-title" style="display:none;"></div>` : '';

                let cartHtml = '';
                // liveSession이 폴링 중 null이 되어도(방송 종료) 이미 만든 예약(cart)은 계속 보여준다 - cartSessionId 참고.
                if (cart.length > 0 && !checkoutMode) {
                    const total = cart.reduce((s, c) => s + c.price * c.quantity, 0);
                    cartHtml = `
                        <div class="cart-drawer">
                            <div class="summary-row" id="cart-summary-row">
                                <div class="left">🛒 <span class="count">${cart.length}건</span> 예약됨 · ${fmtPrice(total)}</div>
                                <button type="button" class="checkout-btn" id="cart-checkout-btn">결제 진행</button>
                            </div>
                            <div class="cart-detail ${cartOpen ? 'open' : ''}" id="cart-detail">
                                ${cart.map(c => `
                                    <div class="cart-item">
                                        <span>${WithPlus.escapeHtml(c.name)} × ${c.quantity}</span>
                                        <span class="timer">${timeLeftLabel(c.expires_at)}</span>
                                        <button type="button" class="remove-btn" data-remove-cart="${c.reservation_id}">✕</button>
                                    </div>`).join('')}
                            </div>
                        </div>`;
                } else if (checkoutMode) {
                    const total = cart.reduce((s, c) => s + c.price * c.quantity, 0);
                    cartHtml = `
                        <div class="cart-drawer">
                            <div class="checkout-panel">
                                <h3>배송 정보 입력</h3>
                                ${cart.map(c => `<div class="cart-item"><span>${WithPlus.escapeHtml(c.name)} × ${c.quantity}</span><span>${fmtPrice(c.price * c.quantity)}</span></div>`).join('')}
                                <div class="field"><label>받는 분 성함</label><input type="text" id="co-name" placeholder="홍길동"></div>
                                <div class="field"><label>연락처</label><input type="text" id="co-phone" placeholder="010-0000-0000"></div>
                                <div class="field"><label>배송지 주소</label><input type="text" id="co-address" placeholder="주소를 입력해주세요"></div>
                                <div class="field"><label>상세 주소</label><input type="text" id="co-address-detail" placeholder="동/호수 등 (선택)"></div>
                                <div style="text-align:right; font-weight:800; margin:8px 0;">합계 ${fmtPrice(total)}</div>
                                <button type="button" class="submit-btn" id="co-submit-btn">${fmtPrice(total)} 결제하기</button>
                                <div class="msg" id="co-msg"></div>
                                <div style="text-align:center; margin-top:10px;"><a href="#" id="co-back-link" style="font-size:0.78em; color:var(--text-gray);">← 예약 목록으로 돌아가기</a></div>
                            </div>
                        </div>`;
                }

                dyn.innerHTML = liveHtml + auctionHtml + couponDropsHtml + guestPinnedHtml + categoryRowHtml() + productsHtml + renderChatSection() + cartHtml;
                if (liveSession) {
                    dyn.insertAdjacentHTML('beforeend', '<button type="button" class="share-btn" id="share-link-btn" title="공유하기">🔗</button>');
                    if (shareCouponDiscountPercent > 0) {
                        dyn.insertAdjacentHTML('beforeend', `<button type="button" class="share-coupon-btn" id="share-coupon-btn" title="공유하면 둘 다 할인">🎁 공유하고 둘 다 ${shareCouponDiscountPercent}% 할인</button>`);
                    }
                }

                syncVideoHero();
                attachHandlers();
                const chatLogEl = document.getElementById('chat-log');
                if (chatLogEl) chatLogEl.scrollTop = chatLogEl.scrollHeight; // 전체 re-render 직후에는 항상 맨 아래로
            }

            function attachHandlers() {
                // ch-join-btn/ch-login-link는 이제 header-stable에 고정되어 있고, 해당 리스너는
                // attachHeaderHandlers()에서 최초 1회만 붙인다(여기서 다시 붙이면 render()가 호출될
                // 때마다 리스너가 중복 등록된다).

                // 🔨 실시간 경매 입찰
                const auctionBidBtn = document.getElementById('auction-bid-btn');
                if (auctionBidBtn) auctionBidBtn.addEventListener('click', async () => {
                    const session = await ensureLogin();
                    if (!session) return;
                    const msgEl = document.getElementById('auction-bid-msg');
                    const amount = Number(document.getElementById('auction-bid-input').value);
                    if (!Number.isFinite(amount) || amount <= 0) { msgEl.textContent = '입찰가를 확인해주세요'; msgEl.className = 'msg error'; return; }
                    auctionBidBtn.disabled = true;
                    try {
                        const token = accessToken || await WithPlus.getAccessToken();
                        const res = await fetch(`/api/live/channels/${encodeURIComponent(slug)}/sessions/${liveSession.id}/auction/${activeAuction.id}/bid`, {
                            method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
                            body: JSON.stringify({ amount })
                        });
                        const json = await res.json();
                        if (!res.ok || !json.success) { msgEl.textContent = json.message || '입찰에 실패했습니다'; msgEl.className = 'msg error'; auctionBidBtn.disabled = false; return; }
                        msgEl.textContent = json.message || '입찰 완료!'; msgEl.className = 'msg success';
                        await refreshActiveAuction();
                        render();
                    } catch (err) {
                        msgEl.textContent = '입찰 중 오류가 발생했습니다'; msgEl.className = 'msg error';
                        auctionBidBtn.disabled = false;
                    }
                });
                // 경매 남은 시간은 15초 폴링 사이에도 매끄럽게 줄어들도록 1초마다 클라이언트에서 직접 갱신한다
                const auctionBannerEl = document.getElementById('auction-banner');
                if (auctionBannerEl && auctionBannerEl.dataset.endsAt) {
                    const endsAtMs = new Date(auctionBannerEl.dataset.endsAt).getTime();
                    const tick = () => {
                        const secEl = document.getElementById('auction-timer-sec');
                        if (!secEl || !document.body.contains(secEl)) return;
                        const secLeft = Math.max(0, Math.ceil((endsAtMs - Date.now()) / 1000));
                        secEl.textContent = String(secLeft);
                        if (secLeft > 0) setTimeout(tick, 1000);
                    };
                    setTimeout(tick, 1000);
                }

                // 🎟️ 선착순 다운로드 쿠폰 받기
                document.querySelectorAll('.cd-claim-btn').forEach(btn => btn.addEventListener('click', async () => {
                    const session = await ensureLogin();
                    if (!session) return;
                    btn.disabled = true;
                    try {
                        const token = accessToken || await WithPlus.getAccessToken();
                        const res = await fetch(`/api/live/coupon-drops/${btn.dataset.couponId}/claim`, {
                            method: 'POST', headers: { Authorization: 'Bearer ' + token }
                        });
                        const json = await res.json();
                        if (res.ok && json.success) {
                            btn.textContent = '다운로드 완료 ✅';
                            await refreshCouponDrops();
                            render();
                        } else {
                            alert(json.message || '쿠폰 다운로드에 실패했습니다');
                            btn.disabled = false;
                        }
                    } catch (err) {
                        alert('쿠폰 다운로드 중 오류가 발생했습니다: ' + err.message);
                        btn.disabled = false;
                    }
                }));

                document.querySelectorAll('.category-icon-item').forEach(btn => btn.addEventListener('click', () => {
                    selectedCategory = btn.dataset.category || null;
                    render();
                }));
                document.querySelectorAll('[data-qty-inc]').forEach(btn => btn.addEventListener('click', () => {
                    const pid = btn.getAttribute('data-qty-inc');
                    const el = document.getElementById('qty-' + pid);
                    const max = inventoryMap[pid] || 99;
                    el.textContent = String(Math.min(max, Number(el.textContent) + 1));
                }));
                document.querySelectorAll('[data-qty-dec]').forEach(btn => btn.addEventListener('click', () => {
                    const pid = btn.getAttribute('data-qty-dec');
                    const el = document.getElementById('qty-' + pid);
                    el.textContent = String(Math.max(1, Number(el.textContent) - 1));
                }));

                document.querySelectorAll('[data-cart-add]').forEach(btn => btn.addEventListener('click', async () => {
                    const pid = btn.getAttribute('data-cart-add');
                    const product = products.find(p => p.id === pid) || pinnedProduct();
                    const qtyEl = document.getElementById('qty-' + pid);
                    const qty = qtyEl ? Number(qtyEl.textContent) : 1;
                    btn.disabled = true;
                    const reservation = await reserveProduct(product, qty, 'cart');
                    if (reservation) {
                        cart.push({ reservation_id: reservation.id, product_id: product.id, name: product.name, price: effectivePrice(product), quantity: qty, expires_at: reservation.expires_at });
                        cartSessionId = liveSession.id;
                        cartOpen = true;
                    }
                    render();
                }));

                document.querySelectorAll('[data-buy-now]').forEach(btn => btn.addEventListener('click', async () => {
                    const pid = btn.getAttribute('data-buy-now');
                    const product = products.find(p => p.id === pid) || pinnedProduct();
                    const qtyEl = document.getElementById('qty-' + pid);
                    const qty = qtyEl ? Number(qtyEl.textContent) : 1;
                    btn.disabled = true;
                    const reservation = await reserveProduct(product, qty, 'checkout');
                    if (reservation) {
                        cart.push({ reservation_id: reservation.id, product_id: product.id, name: product.name, price: effectivePrice(product), quantity: qty, expires_at: reservation.expires_at });
                        cartSessionId = liveSession.id;
                        checkoutMode = true;
                    }
                    render();
                }));

                document.querySelectorAll('[data-remove-cart]').forEach(btn => btn.addEventListener('click', () => {
                    const rid = btn.getAttribute('data-remove-cart');
                    const item = cart.find(c => c.reservation_id === rid);
                    if (item) cancelReservation(item);
                }));

                const summaryRow = document.getElementById('cart-summary-row');
                if (summaryRow) summaryRow.addEventListener('click', (e) => {
                    if (e.target.id === 'cart-checkout-btn') return;
                    cartOpen = !cartOpen;
                    render();
                });

                const checkoutBtn = document.getElementById('cart-checkout-btn');
                if (checkoutBtn) checkoutBtn.addEventListener('click', async () => {
                    // 결제 진행 단계로 예약을 전환(만료시간 연장) - 사용자가 배송정보 입력하는 동안 재고가 풀리지 않도록
                    for (const item of cart) {
                        try {
                            const res = await fetch(`/api/live/channels/${encodeURIComponent(slug)}/sessions/${cartSessionId}/reservations/${item.reservation_id}`, {
                                method: 'PATCH',
                                headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + accessToken },
                                body: JSON.stringify({ stage: 'checkout' })
                            });
                            const json = await res.json();
                            if (res.ok && json.success && json.data.expires_at) item.expires_at = json.data.expires_at;
                        } catch (err) { /* 개별 실패는 무시하고 계속 진행 - 최종 주문 시 서버가 다시 검증한다 */ }
                    }
                    checkoutMode = true;
                    render();
                });

                const backLink = document.getElementById('co-back-link');
                if (backLink) backLink.addEventListener('click', (e) => { e.preventDefault(); checkoutMode = false; render(); });

                const submitBtn = document.getElementById('co-submit-btn');
                if (submitBtn) submitBtn.addEventListener('click', async () => {
                    const msg = document.getElementById('co-msg');
                    msg.className = 'msg'; msg.textContent = '';
                    const name = document.getElementById('co-name').value.trim();
                    const phone = document.getElementById('co-phone').value.trim();
                    const address = document.getElementById('co-address').value.trim();
                    const addressDetail = document.getElementById('co-address-detail').value.trim();
                    if (!name || !phone || !address) {
                        msg.textContent = '받는 분 성함, 연락처, 배송지 주소를 모두 입력해주세요.';
                        msg.className = 'msg error';
                        return;
                    }
                    submitBtn.disabled = true;
                    submitBtn.textContent = '주문 처리 중...';
                    try {
                        const res = await fetch('/api/orders', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + accessToken },
                            body: JSON.stringify({
                                items: cart.map(c => ({ product_id: c.product_id, name: c.name, price: c.price, quantity: c.quantity })),
                                channel_id: channel.id,
                                live_session_id: cartSessionId,
                                reservation_ids: cart.map(c => c.reservation_id),
                                live_attribution: attribution,
                                shipping_address: { name, phone, address: addressDetail ? address + ' ' + addressDetail : address },
                                payment_method: 'pending'
                            })
                        });
                        const json = await res.json();
                        if (!res.ok || !json.success) throw new Error(json.message || '주문 처리에 실패했습니다');
                        cart = [];
                        cartSessionId = null;
                        checkoutMode = false;

                        // 결제(PG) 연동이 하나라도 켜져있으면 실제 결제 단계로, 전부 꺼져있으면 기존처럼 주문 접수만으로 완료 처리
                        // (cart.html의 일반 주문과 동일한 규칙 - "주문 생성"과 "결제 완료"는 다른 단계다)
                        const pgConfigs = { toss: { enabled: false }, kakaopay: { enabled: false }, naverpay: { enabled: false } };
                        try {
                            const [tossRes, kakaoRes, naverRes] = await Promise.all([
                                fetch('/api/payments/toss/config'), fetch('/api/payments/kakaopay/config'), fetch('/api/payments/naverpay/config')
                            ]);
                            const [tossJson, kakaoJson, naverJson] = await Promise.all([tossRes.json(), kakaoRes.json(), naverRes.json()]);
                            if (tossJson.success) pgConfigs.toss = tossJson.data;
                            if (kakaoJson.success) pgConfigs.kakaopay = kakaoJson.data;
                            if (naverJson.success) pgConfigs.naverpay = naverJson.data;
                        } catch (e) { /* 조회 실패 시 결제 단계 없이 기존 흐름으로 진행 */ }

                        if (pgConfigs.toss.enabled || pgConfigs.kakaopay.enabled || pgConfigs.naverpay.enabled) {
                            const sessionInfo = await WithPlus.getSession();
                            await renderLivePaymentStep(json.data, pgConfigs, {
                                userId: sessionInfo?.user?.id, email: sessionInfo?.user?.email, name, phone
                            });
                        } else {
                            orderResult = json.data;
                            render();
                        }
                    } catch (err) {
                        msg.textContent = '주문 처리 중 오류가 발생했습니다: ' + err.message;
                        msg.className = 'msg error';
                        submitBtn.disabled = false;
                        submitBtn.textContent = '다시 시도';
                    }
                });

                const chatSendBtn = document.getElementById('chat-send-btn');
                if (chatSendBtn) chatSendBtn.addEventListener('click', sendChatMessage);
                const chatInput = document.getElementById('chat-input');
                if (chatInput) chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChatMessage(); });
                const chatLoadOlderBtn = document.getElementById('chat-load-older-btn');
                if (chatLoadOlderBtn) chatLoadOlderBtn.addEventListener('click', loadOlderChatMessages);

                // 🎁 실시간 가상 선물/후원(경쟁사 기능 격차 백로그 6번) - 선물 버튼을 누르면 카탈로그 패널이 열리고,
                // 항목을 클릭하면 즉시 전송된다(별도 확인 모달 없이 원탭으로 보내는 편이 방송 중 몰입감에 맞다).
                const giftToggleBtn = document.getElementById('gift-toggle-btn');
                const giftPickerEl = document.getElementById('gift-picker');
                if (giftToggleBtn && giftPickerEl) {
                    giftToggleBtn.addEventListener('click', () => {
                        giftPickerOpen = !giftPickerOpen;
                        giftPickerEl.classList.toggle('open', giftPickerOpen);
                    });
                    giftPickerEl.querySelectorAll('.gift-item').forEach(el => {
                        el.addEventListener('click', () => sendGift(el.dataset.giftKey));
                    });
                }

                // 🎤 라이트 멀티호스트(B8) - 게스트 초대코드 입력. 로그인이 필요하고, 성공하면 그 즉시 채팅에
                // 게스트 배지가 붙기 시작한다(다음 폴링 때 activeGuests에 반영됨).
                const guestRedeemLink = document.getElementById('guest-redeem-link');
                if (guestRedeemLink) guestRedeemLink.addEventListener('click', async (e) => {
                    e.preventDefault();
                    const session = await ensureLogin();
                    if (!session) return;
                    const code = window.prompt('방송 진행자에게 받은 게스트 초대코드를 입력해주세요');
                    if (!code || !code.trim()) return;
                    try {
                        const token = accessToken || await WithPlus.getAccessToken();
                        const res = await fetch('/api/live/guests/redeem', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
                            body: JSON.stringify({ invite_code: code.trim() })
                        });
                        const json = await res.json();
                        if (res.ok && json.success) {
                            alert('게스트로 연결되었습니다! 채팅에 게스트 배지가 표시됩니다.');
                            await refreshActiveGuests();
                            render();
                        } else {
                            alert(json.message || '초대코드 연결에 실패했습니다');
                        }
                    } catch (err) {
                        alert('초대코드 연결 중 오류가 발생했습니다');
                    }
                });

                const shareBtn = document.getElementById('share-link-btn');
                if (shareBtn) shareBtn.addEventListener('click', async () => {
                    try {
                        const qs = new URLSearchParams();
                        if (attribution.source_platform) qs.set('platform', attribution.source_platform);
                        if (attribution.campaign) qs.set('campaign', attribution.campaign);
                        if (attribution.referrer_code) qs.set('ref', attribution.referrer_code);
                        if (attribution.coupon_code) qs.set('coupon', attribution.coupon_code);
                        const res = await fetch(`/api/live/channels/${encodeURIComponent(slug)}/sessions/${liveSession.id}/deep-link?${qs.toString()}`);
                        const json = await res.json();
                        const fullUrl = location.origin + (json.data ? json.data.deep_link : location.pathname + location.search);
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            await navigator.clipboard.writeText(fullUrl);
                            shareBtn.textContent = '✅';
                            setTimeout(() => { shareBtn.textContent = '🔗'; }, 1500);
                        }
                    } catch (err) { /* 클립보드 접근 실패 시 조용히 무시 */ }
                });

                // 🎁 바이럴 공유쿠폰(소문내면 할인) - 로그인한 회원만 자신만의 공유코드를 만들 수 있다
                // (누가 공유했는지 알아야 보상을 지급할 수 있으므로 익명 공유와 달리 로그인이 필요).
                const shareCouponBtn = document.getElementById('share-coupon-btn');
                if (shareCouponBtn) shareCouponBtn.addEventListener('click', async () => {
                    const session = await ensureLogin();
                    if (!session) return;
                    const originalText = shareCouponBtn.textContent;
                    shareCouponBtn.disabled = true;
                    try {
                        const token = accessToken || await WithPlus.getAccessToken();
                        const res = await fetch(`/api/live/channels/${encodeURIComponent(slug)}/sessions/${liveSession.id}/share-coupon-link`, {
                            headers: { Authorization: 'Bearer ' + token }
                        });
                        const json = await res.json();
                        if (!res.ok || !json.success) { alert(json.message || '공유 링크 생성에 실패했습니다'); return; }
                        const fullUrl = location.origin + json.data.deep_link;
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            await navigator.clipboard.writeText(fullUrl);
                            shareCouponBtn.textContent = '✅ 링크가 복사되었어요!';
                            setTimeout(() => { shareCouponBtn.textContent = originalText; }, 2000);
                        }
                        alert(`나만의 공유 링크가 복사되었습니다!\n\n친구가 이 링크로 들어와서 이 방송에서 구매를 완료하면, 두 분 모두 ${json.data.discount_percent}% 할인쿠폰을 받아요. (자기 자신에게는 적용되지 않아요)`);
                    } catch (err) {
                        alert('공유 링크 생성 중 오류가 발생했습니다');
                    } finally {
                        shareCouponBtn.disabled = false;
                    }
                });
            }

            render();

            // 로그인 상태면 채팅 조회도 처음부터 토큰을 실어보내 is_mine이 첫 로드부터 정확히 표시되도록 한다
            // (비로그인이어도 채팅 자체는 볼 수 있으므로 로그인을 강제하지는 않는다).
            (async () => {
                try {
                    const session = await WithPlus.getSession();
                    if (session) accessToken = await WithPlus.getAccessToken();
                } catch (err) { /* 세션 확인 실패해도 비로그인 상태로 계속 진행 */ }
                if (chatSessionId) {
                    await loadChatMessages();
                    render();
                }
            })();

            // 상품핀 변경/재고 변동/방송 시작 여부를 주기적으로 갱신한다. 처음 들어왔을 때 방송 중이 아니었어도
            // (liveSession이 처음부터 null이었어도) 계속 폴링해야 "구경하던 중에 방송이 시작되는" 경우를 놓치지
            // 않는다 - 예전에는 최초 로드시 liveSession이 없으면 폴링 자체를 시작하지 않아서 새로고침 전까지는
            // 방송 시작을 전혀 알 수 없었다.
            setInterval(async () => {
                try {
                    const res = await fetch('/api/live/channels/' + encodeURIComponent(slug) + '/sessions/live');
                    const json = await res.json();
                    if (res.ok && json.success) {
                        liveSession = json.data;
                        if (liveSession) await refreshInventory();
                        await refreshFlashSales();
                        await refreshActiveQuiz();
                        await refreshActiveAuction();
                        await refreshCouponDrops();
                        await refreshActiveGuests();
                        await refreshViewerStats();
                        await refreshReplaySession();
                        // 만료된 예약은 화면 목록에서도 정리 - 방송 종료로 liveSession이 null이 된 뒤에도 cart의
                        // TTL은 계속 흐르므로 liveSession 상태와 무관하게 항상 확인한다.
                        cart = cart.filter(c => new Date(c.expires_at).getTime() > Date.now());
                        // 새 방송(다른 세션 id)이 시작됐으면 채팅 로그도 새로 시작한다 - 지난 방송의 채팅과 섞이지 않도록.
                        if (liveSession && liveSession.id !== chatSessionId) {
                            chatSessionId = liveSession.id;
                            chatMessages = [];
                            chatLastCreatedAt = null;
                            chatHasMoreOlder = false;
                            await loadChatMessages();
                        }
                        // 영상은 결제 진행 중에도(dyn이 결제화면으로 덮여 있어도) 계속 최신 상태로 맞춰둔다 -
                        // 방송이 끊기거나 모드가 바뀌면 결제 화면 위쪽 영상도 그에 맞게 반영되어야 한다.
                        await syncVideoHero();
                        if (!checkoutMode && !paymentInProgress) render();
                    }
                } catch (err) { /* 폴링 실패는 조용히 무시하고 다음 주기에 재시도 */ }
            }, 15000);
            // 채팅은 좀 더 짧은 주기로 폴링해 대화가 자연스럽게 이어지도록 한다 (chatSessionId 없으면 내부에서 바로 리턴)
            setInterval(pollChatMessages, 3000);
            // 남은시간 표시는 좀 더 자주 갱신
            setInterval(() => {
                if (cart.length > 0 && !checkoutMode && !paymentInProgress) {
                    document.querySelectorAll('.cart-item .timer').forEach((el, i) => {
                        if (cart[i]) el.textContent = timeLeftLabel(cart[i].expires_at);
                    });
                }
                // 타임세일 카운트다운도 화면을 통째로 다시 그리지 않고 숫자만 매초 갱신한다
                document.querySelectorAll('[data-flash-timer]').forEach(el => {
                    const pid = el.getAttribute('data-flash-timer');
                    const fs = flashSaleMap[pid];
                    if (fs) el.textContent = flashSaleCountdownLabel(fs.ends_at);
                });
            }, 1000);
        })();
    </script>
</body>
</html>
