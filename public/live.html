<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE 라이브 쇼핑 - WITH+</title>
    <meta name="description" content="WITH+ 라이브 쇼핑(LIVE+) 안내">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary-color: #D32F5B; --text-dark: #333333; --text-gray: #666666; --border-color: #E0E0E0; }
        body { font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text-dark); line-height: 1.6; background: #FFFFFF; }
        .header { background: #fff; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .header-main { max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { text-decoration: none; }
        .icon-button { font-size: 1.3em; color: var(--text-dark); position: relative; text-decoration: none; display: inline-block; }
        .cart-badge { position: absolute; top: -8px; right: -8px; background: var(--primary-color); color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 0.75em; font-weight: bold; }
        .live-wrap { max-width: 560px; margin: 60px auto; padding: 0 20px; text-align: center; }
        .live-badge { display: inline-flex; align-items: center; gap: 6px; background: #E8125C; color: #fff; font-weight: 800; border-radius: 999px; padding: 6px 16px; letter-spacing: .06em; }
        .live-badge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
        .live-wrap h1 { font-size: 1.6em; margin: 18px 0 10px; }
        .live-wrap p { color: var(--text-gray); margin-bottom: 26px; }
        .live-wrap a.btn { display: inline-block; background: #FFF0F4; color: #E8125C; font-weight: 700; text-decoration: none; border-radius: 999px; padding: 12px 26px; }
    </style>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="/typography.css">
</head>
<body>
    <header class="header">
        <div class="header-main">
            <a href="/" class="logo" aria-label="WITH+ 홈"><img src="/images/brand/withplus-logo.webp" alt="WITH+" class="wp-logo-img" width="130" height="40"><span class="wp-logo-tagline">함께할수록 <b>더해지는 가치</b></span></a>
            <div style="display:flex; gap:20px; align-items:center;">
                <a class="icon-button" id="account-link" href="/login">👤</a>
                <a class="icon-button" href="/cart">🛒<span class="cart-badge">0</span></a>
            </div>
        </div>
    </header>

    <main class="live-wrap">
        <span class="live-badge">LIVE</span>
        <h1>라이브 쇼핑을 준비하고 있어요</h1>
        <p>실시간 라이브 방송 판매는 WITH+의 라이브커머스 서비스(LIVE+)에서 곧 만나보실 수 있습니다.</p>
        <a class="btn" href="/">쇼핑 계속하기</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/withplus-common.js"></script>
    <script>WithPlus.initHeader();</script>
</body>
</html>
