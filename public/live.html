<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 설치형 앱(PWA) 표준 v1 -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#D32F5B">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="WITH+">
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/icon/apple">
    <script src="/pwa-install.js" defer></script>
    <title>라이브 - WITH+</title>
    <meta name="description" content="WITH+ 라이브 쇼핑 - 지금 방송 중인 채널과 다시보기를 만나보세요.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary-color: #D32F5B; --text-dark: #333333; --text-gray: #666666; --border-color: #E0E0E0; }
        body { font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text-dark); line-height: 1.6; background: #FFFFFF; }
        .header { background: #fff; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .header-main { max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { text-decoration: none; }
        .icon-button { font-size: 1.3em; color: var(--text-dark); position: relative; text-decoration: none; display: inline-block; }
        .cart-badge { position: absolute; top: -8px; right: -8px; background: var(--primary-color); color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 0.75em; font-weight: bold; }
        .live-badge { display: inline-flex; align-items: center; gap: 6px; background: #E8125C; color: #fff; font-weight: 800; border-radius: 999px; padding: 6px 16px; letter-spacing: .06em; font-size: 0.62em; }
        .live-badge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
        .live-list-wrap { max-width: 1100px; margin: 24px auto 40px; padding: 0 16px; }
        .live-list-title { display: flex; align-items: center; gap: 10px; font-size: 1.5em; }
        .live-list-sub { color: var(--text-gray); margin: 6px 0 18px; font-size: 0.95em; }
        .live-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .live-card { display: block; border-radius: 14px; overflow: hidden; background: #fff; border: 1px solid #F1E4E8; text-decoration: none; color: inherit; box-shadow: 0 4px 14px rgba(0,0,0,0.04); transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
        .live-card:hover { transform: translateY(-2px); border-color: #F3B5C8; box-shadow: 0 10px 24px rgba(211,47,91,0.12); }
        .live-cover { aspect-ratio: 16 / 9; background: linear-gradient(135deg, #FFE1EA, #FFC9D9) center / cover no-repeat; position: relative; }
        .live-logo { position: absolute; left: 12px; bottom: -18px; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #fff; background: #fff center / cover no-repeat; box-shadow: 0 2px 6px rgba(0,0,0,0.12); }
        .live-info { padding: 24px 14px 14px; }
        .live-name { font-weight: 700; font-size: 1.02em; display: flex; align-items: center; gap: 6px; min-width: 0; }
        .live-official { font-size: 11px; color: #fff; background: #E8125C; border-radius: 4px; padding: 2px 6px; flex-shrink: 0; }
        .live-tagline { color: var(--text-gray); font-size: 0.88em; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .live-empty { grid-column: 1 / -1; text-align: center; color: var(--text-gray); padding: 50px 0; }
        @media (max-width: 768px) { .live-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .live-list-title { font-size: 1.25em; } }
    </style>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="/typography.css">
    <link rel="stylesheet" href="/withplus-live.css">
</head>
<body>
    <header class="header">
        <div class="header-main">
            <a href="/" class="logo" aria-label="WITH+ 홈"><img src="/images/brand/withplus-logo.webp" alt="WITH+" class="wp-logo-img" width="130" height="40"><span class="wp-logo-tagline">함께할수록 <b>더해지는 가치</b></span></a>
            <div style="display:flex; gap:20px; align-items:center;">
                <a class="icon-button" id="account-link" href="/login">👤</a>
                <a class="icon-button" href="/cart">🛒<span class="cart-badge">0</span></a>
            </div>
        </div>
    </header>

    <main class="live-list-wrap">
        <h1 class="live-list-title"><span class="live-badge">LIVE</span> WITH+ 라이브</h1>
        <p class="live-list-sub">지금 방송 중이거나 다시보기를 볼 수 있는 채널이에요.</p>
        <div class="live-grid" id="live-grid"><p class="live-empty">불러오는 중...</p></div>
    </main>

    <script src="/vendor/supabase.min.js"></script>
    <script src="/withplus-pricing.js"></script>
    <script src="/withplus-common.js"></script>
    <script src="/voice-dictation.js?v=1" defer></script>
    <script>
        WithPlus.initHeader();
        (async function loadChannels() {
            const grid = document.getElementById('live-grid');
            try {
                const { ok, json } = await WithPlus.fetchJSON('/api/live/channels');
                if (!ok || !json.success) throw new Error('채널 목록을 불러오지 못했습니다');
                const channels = json.data || [];
                if (channels.length === 0) {
                    grid.innerHTML = '<p class="live-empty">아직 개설된 라이브 채널이 없습니다. 곧 만나요!</p>';
                    return;
                }
                grid.innerHTML = channels.map(c => `
                    <a class="live-card" href="/live/${encodeURIComponent(c.slug)}">
                        <div class="live-cover" ${c.cover_image_url ? `style="background-image:url('${WithPlus.safeUrlAttr(c.cover_image_url)}')"` : ''}>
                            <span class="live-logo" ${c.logo_url ? `style="background-image:url('${WithPlus.safeUrlAttr(c.logo_url)}')"` : ''}></span>
                        </div>
                        <div class="live-info">
                            <div class="live-name">${WithPlus.escapeHtml(c.name)}${c.is_official ? '<span class="live-official">공식</span>' : ''}</div>
                            ${c.tagline ? `<div class="live-tagline">${WithPlus.escapeHtml(c.tagline)}</div>` : ''}
                        </div>
                    </a>`).join('');
            } catch (err) {
                grid.innerHTML = `<p class="live-empty">${WithPlus.escapeHtml(err.message)}</p>`;
            }
        })();
    </script>
</body>
</html>
