                        const parts = [b.company_name && `상호 ${b.company_name}`, b.ceo_name && `대표 ${b.ceo_name}`, b.business_number && `사업자등록번호 ${b.business_number}`, b.mail_order_registration_number && `통신판매업 ${b.mail_order_registration_number}`, b.phone && `고객센터 ${b.phone}`, b.address && `주소 ${b.address}`].filter(Boolean);
                        if (parts.length) document.getElementById('ss-ret-seller').innerHTML = parts.map(esc).join('<br>');
                    }).catch(() => {});

                    // 고정 탭 — 누르면 해당 칸으로, 스크롤하면 지금 보는 칸에 밑줄
                    const tabs = document.getElementById('ss-tabs');
                    const links = Array.from(tabs.querySelectorAll('a'));
                    links.forEach(a => a.addEventListener('click', (e) => {
                        e.preventDefault();
                        const t = document.querySelector(a.getAttribute('href'));
                        if (t) window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - tabs.offsetHeight - 70, behavior: 'smooth' });
                    }));
                    const onScroll = () => {
                        let on = links[0];
                        links.forEach(a => { const t = document.querySelector(a.getAttribute('href')); if (t && t.getBoundingClientRect().top - tabs.offsetHeight - 90 <= 0) on = a; });
                        links.forEach(a => a.classList.toggle('on', a === on));
                    };
                    window.addEventListener('scroll', () => requestAnimationFrame(onScroll), { passive: true });

                    // 상세정보 펼쳐보기 — 길면 접어 두고 버튼으로 펼친다
                    const body = document.getElementById('ss-detail-body');
                    const expand = document.getElementById('ss-expand');
                    const checkCollapse = () => {
                        if (!body || !expand || body.classList.contains('open')) return;
                        const tall = body.scrollHeight > 1500;
                        body.classList.toggle('collapsed', tall);
                        expand.hidden = !tall;
                    };
                    if (body && expand) {
                        body.querySelectorAll('img').forEach(img => img.addEventListener('load', checkCollapse));
                        setTimeout(checkCollapse, 300);
                        expand.addEventListener('click', () => {
                            const open = !body.classList.contains('open');
                            body.classList.toggle('open', open);
                            body.classList.toggle('collapsed', !open);
                            expand.textContent = open ? '상세정보 접기 ⌃' : '상세정보 펼쳐보기 ⌄';
                            if (!open) document.getElementById('ss-detail').scrollIntoView({ behavior: 'smooth' });
                        });
                    }

                    // 🧩 배치 — 대표 사진 칸 높이·사진 확대/위치, 상세 사진 너비·정렬 (관리자가 저장한 값)
                    const LKEY = 'product:' + p.id;
                    const MAIN_DEF = { h: 460, zoom: 1, x: 50, y: 50, fit: 'cover' };
                    const DET_DEF = { w: 100, align: 'center' };
                    let lay = { main: {}, detail: { blocks: {} } };
                    function applyMainLayout() {
                        const m = Object.assign({}, MAIN_DEF, lay.main || {});
                        document.getElementById('main-image').style.setProperty('--main-h', m.h + 'px');
                        WithPlus.applyPhotoState(mainPic, m);
                    }
                    function applyDetailLayout() {
                        const d = Object.assign({}, DET_DEF, lay.detail || {});
                        document.querySelectorAll('#ss-detail-body .detail-section-block').forEach(block => {
                            const img = block.querySelector('img');
                            if (!img) return;
                            const own = ((lay.detail || {}).blocks || {})[block.dataset.block] || {};
                            const w = own.w != null ? own.w : d.w;
                            const align = own.align || d.align;
                            const box = block.querySelector('.wp-wm-frame') || img;
                            box.style.width = w + '%';
                            box.style.marginLeft = align === 'left' ? '0' : 'auto';
                            box.style.marginRight = align === 'right' ? '0' : 'auto';
                            if (box !== img) img.style.width = '100%';
                        });
                    }
                    (async () => {
                        const v = await WithPlus.getLayout(LKEY);
                        lay = { main: (v && v.main) || {}, detail: Object.assign({ blocks: {} }, (v && v.detail) || {}) };
                        applyMainLayout(); applyDetailLayout();
                        const save = () => WithPlus.saveLayout(LKEY, lay);
                        await WithPlus.addLayoutEditButton('🛠 대표 사진 편집', () => {
                            const st = Object.assign({}, MAIN_DEF, lay.main);
                            WithPlus.openLayoutEditor({
                                title: '대표 사진 (이 상품)', state: st, defaults: Object.assign({}, MAIN_DEF),
                                hint: '사진을 끌면 이동 · 휠로 확대 · ◢ 끌면 칸 높이 · 사진마다 같은 값 적용',
                                fields: [
                                    { key: 'h', label: '사진 칸 높이', min: 260, max: 900, step: 1, unit: 'px' },
                                    { key: 'zoom', label: '사진 확대', min: 1, max: 4, step: 0.01, unit: '배' },
                                    { key: 'x', label: '사진 좌우', min: 0, max: 100, step: 1, unit: '%' },
                                    { key: 'y', label: '사진 위아래', min: 0, max: 100, step: 1, unit: '%' },
                                    { key: 'fit', label: '사진 맞춤', type: 'select', options: [['cover', '칸 꽉 채우기'], ['contain', '사진 전체 보이기']] }
                                ],
                                onChange: (s) => { lay.main = { h: s.h, zoom: s.zoom, x: s.x, y: s.y, fit: s.fit }; applyMainLayout(); },
                                onSave: () => save(),
                                drag: { el: document.getElementById('main-image'), pan: ['x', 'y'], zoomKey: 'zoom', resize: [null, 'h'], move: null, toUnits: (dim, delta) => delta }
                            });
                        });
                        if (!document.querySelector('#ss-detail-body .detail-section-block img')) return;
                        function openDetailEditor(blockEl) {
                            const all = Object.assign({}, DET_DEF, lay.detail);
                            const idx = blockEl ? blockEl.dataset.block : null;
                            const own = idx != null ? Object.assign({ w: all.w, align: all.align }, (lay.detail.blocks || {})[idx] || {}) : null;
                            const st = own || { w: all.w, align: all.align };
                            const target = blockEl || document.querySelector('#ss-detail-body .detail-section-block img').closest('.detail-section-block');
                            const frame = target.querySelector('.wp-wm-frame') || target.querySelector('img');
                            document.querySelectorAll('#ss-detail-body .detail-section-block img').forEach(img => img.closest('.detail-section-block').classList.add('wp-le-pick'));
                            const pickHandler = (e) => { const b = e.target.closest('.detail-section-block'); if (!b || !b.querySelector('img')) return; e.preventDefault(); e.stopPropagation(); WithPlus.closeLayoutEditor(); openDetailEditor(b); };
                            document.getElementById('ss-detail-body').addEventListener('click', pickHandler, true);
                            WithPlus.openLayoutEditor({
                                title: idx != null ? `상세 사진 ${Number(idx) + 1}번만` : '상세 사진 전체(기본값)',
                                hint: '다른 사진을 누르면 그 사진만 따로 조절 · ◢ 끌면 너비',
                                state: st, defaults: Object.assign({}, DET_DEF),
                                fields: [
                                    { key: 'w', label: '사진 너비', min: 20, max: 100, step: 1, unit: '%' },
                                    { key: 'align', label: '정렬', type: 'select', options: [['center', '가운데'], ['left', '왼쪽'], ['right', '오른쪽']] }
                                ],
                                extraButtons: idx != null ? '<button type="button" class="wp-le-all">↩ 전체 설정 따르기</button>' : '',
                                onBar: (bar) => {
                                    const b = bar.querySelector('.wp-le-all');
                                    if (b) b.addEventListener('click', () => { delete lay.detail.blocks[idx]; applyDetailLayout(); WithPlus.closeLayoutEditor(); openDetailEditor(null); });
                                },
                                onChange: (s) => {
                                    if (idx != null) lay.detail.blocks = Object.assign({}, lay.detail.blocks, { [idx]: { w: s.w, align: s.align } });
                                    else Object.assign(lay.detail, { w: s.w, align: s.align });
                                    applyDetailLayout();
                                },
                                onSave: () => save(),
                                drag: { el: frame, pan: null, zoomKey: null, resize: ['w', null], move: null, toUnits: (dim, delta) => delta / document.getElementById('ss-detail-body').getBoundingClientRect().width * 100 },
                                onClose: () => {
                                    document.getElementById('ss-detail-body').removeEventListener('click', pickHandler, true);
                                    document.querySelectorAll('.wp-le-pick').forEach(el => el.classList.remove('wp-le-pick'));
                                }
                            });
                        }
                        await WithPlus.addLayoutEditButton('🛠 상세 사진 편집', () => {
                            const body = document.getElementById('ss-detail-body');
                            if (body.classList.contains('collapsed')) document.getElementById('ss-expand').click();
                            body.scrollIntoView({ behavior: 'smooth' });
                            openDetailEditor(null);
                        });
                        const fabs = document.querySelectorAll('.wp-le-fab');
                        if (fabs.length > 1) fabs[1].style.bottom = '134px';
                    })();
                }

                // ============================================
                // 🛍️ 계속 쇼핑하기 — 인기·같은 카테고리·최근 본 상품 + 스크롤하면 계속 이어지는 추천 상품
                // ============================================
                async function initContinueShopping(cur) {
                    let all = [];
                    try {
                        const { ok, json } = await WithPlus.fetchJSON(WithPlus.withCommunityParam ? WithPlus.withCommunityParam('/api/products') : '/api/products');
                        if (ok && json.success) all = (json.data || []).filter(x => x.id !== cur.id);
                    } catch (e) { return; }
                    if (!all.length) return;
                    const inStock = all.filter(x => Number(x.stock) > 0);
                    // 사진이 있는 상품을 먼저 보여준다(사진 없는 상품은 뒤로)
                    const hasImg = (x) => Array.isArray(x.images_urls) && x.images_urls.length > 0 ? 0 : 1;
                    const pool = (inStock.length ? inStock : all).slice().sort((a, b) => hasImg(a) - hasImg(b));
                    const card = (x) => WithPlus.renderProductCard(x);
                    const fill = (secId, rowId, list) => { if (!list.length) return; document.getElementById(rowId).innerHTML = list.map(card).join(''); document.getElementById(secId).hidden = false; };
                    let scores = {};
                    try { scores = await WithPlus.getRankingScores(); } catch (e) { /* 순위 정보 없이도 동작 */ }
                    const popular = (WithPlus.sortProductsBy ? WithPlus.sortProductsBy(pool.slice(), 'popular', scores) : pool.slice()).sort((a, b) => hasImg(a) - hasImg(b));
                    fill('ssm-store', 'ssm-store-row', popular.slice(0, 12));
                    const sameCat = popular.filter(x => x.category === cur.category);
                    if (sameCat.length) {
                        const catInfo = (WithPlus.getCategoriesRawCached ? WithPlus.getCategoriesRawCached() : []).find(c => c.db_category === cur.category || c.slug === cur.category);
                        if (catInfo) { document.getElementById('ssm-cat-title').textContent = `🔍 ${catInfo.label} 카테고리 상품`; document.getElementById('ssm-cat-link').href = '/category/' + catInfo.slug; }
                        else document.getElementById('ssm-cat-link').hidden = true;
                        fill('ssm-cat', 'ssm-cat-row', sameCat.slice(0, 12));
                    }
                    const byId = {}; all.forEach(x => { byId[x.id] = x; });
                    fill('ssm-recent', 'ssm-recent-row', (WithPlus.getRecentlyViewed() || []).map(id => byId[id]).filter(Boolean).slice(0, 12));
                    const cats = (WithPlus.getCategoriesRawCached ? WithPlus.getCategoriesRawCached() : []).filter(c => !c.parent_id);
                    if (cats.length) {
                        document.getElementById('ssm-cats-row').innerHTML = cats.map(c => `<a class="ssm-cat" href="/category/${encodeURIComponent(c.slug)}"><span class="ssm-cat-ico">${WithPlus.getCategory3DIcon ? WithPlus.getCategory3DIcon(c, 34) : WithPlus.escapeHtml(c.emoji || '🛍️')}</span><span>${WithPlus.escapeHtml(c.label)}</span></a>`).join('');
                        document.getElementById('ssm-cats').hidden = false;
                    }
                    // 끝없이 이어지는 추천: 이 상품과 같은 카테고리·인기 상품을 앞쪽에, 나머지는 섞어서 12개씩
                    const seed = String(cur.id).split('').reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) >>> 0, 7);
                    let r = seed; const rand = () => (r = (r * 1103515245 + 12345) >>> 0) / 4294967296;
                    const shuffled = pool.slice().map(x => ({ x, k: rand() + hasImg(x) * 2 - (x.category === cur.category ? 0.35 : 0) - Math.min(0.3, ((scores[x.id] && scores[x.id].popular) || 0) / 1000) })).sort((a, b) => a.k - b.k).map(o => o.x);
                    const grid = document.getElementById('ssm-feed-grid');
                    const loadBtn = document.getElementById('ssm-load');
                    let shown = 0;
                    const more = () => {
                        const next = shuffled.slice(shown, shown + 12);
                        if (!next.length) { loadBtn.hidden = true; return; }
                        grid.insertAdjacentHTML('beforeend', next.map(card).join(''));
                        shown += next.length;
                        if (shown >= shuffled.length) { loadBtn.hidden = true; observer && observer.disconnect(); }
                        if (WithPlus.syncWishlistHearts) WithPlus.syncWishlistHearts();
                    };
                    let observer = null;
                    if ('IntersectionObserver' in window) {
                        observer = new IntersectionObserver((ents) => { if (ents.some(e => e.isIntersecting)) more(); }, { rootMargin: '600px 0px' });
                        observer.observe(document.getElementById('ssm-sentinel'));
                    }
                    loadBtn.addEventListener('click', more);
                    document.getElementById('ssm-feed').hidden = false;
                    more();
                    if (WithPlus.attachProductCardInteractions) WithPlus.attachProductCardInteractions();
                    if (WithPlus.syncWishlistHearts) WithPlus.syncWishlistHearts();
                    // 맨 위로 버튼
                    const top = document.createElement('button');
                    top.type = 'button'; top.className = 'ssm-top'; top.setAttribute('aria-label', '맨 위로'); top.textContent = '▲';
                    top.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
                    document.body.appendChild(top);
                    window.addEventListener('scroll', () => { top.classList.toggle('on', window.scrollY > 900); }, { passive: true });
                }

                // 📣 창고털이 밴드 후기 — 관리자가 승인한 것만 서버가 내려준다
                async function loadBandReviews(productId) {
                    try {
                        const res = await fetch('/api/products/' + encodeURIComponent(productId) + '/band-reviews?limit=10');
                        const json = await res.json();
                        const list = (json && json.success && json.data) || [];
                        if (!list.length) return;
                        document.getElementById('band-reviews-count').textContent = '(' + (json.total || list.length) + ')';
                        document.getElementById('band-reviews-list').innerHTML = list.map(r => `
                            <div class="review-item band-review-item">
                                <div class="wp-review-author">${WithPlus.escapeHtml(r.author_masked || '회원')}</div>
                                <div class="review-comment band-review-text">${WithPlus.escapeHtml(r.body || '')}</div>
                                ${(r.stored_photo_urls || []).length ? `<div class="band-review-photos">${r.stored_photo_urls.slice(0, 6).map(u => `<img src="${WithPlus.safeUrlAttr(u)}" alt="후기 사진" loading="lazy">`).join('')}</div>` : ''}
                                <div class="review-date">${WithPlus.escapeHtml(r.posted_label || '')}</div>
                            </div>`).join('');
                        document.querySelectorAll('.band-review-text').forEach(el => el.addEventListener('click', () => el.classList.toggle('open')));
                        document.getElementById('band-reviews').style.display = '';
                    } catch (e) { /* 밴드 후기는 부가 정보 — 실패해도 상품 화면은 그대로 */ }
                }

                // 이미지 갤러리: 썸네일 클릭 시 메인 이미지 전환, 메인 이미지 클릭 시 확대(라이트박스)
                const mainImageEl = document.getElementById('main-image');
                const thumbStrip = document.getElementById('thumb-strip');
                let activeImageIndex = 0;
                if (thumbStrip) {
                    thumbStrip.querySelectorAll('.thumb-item').forEach(thumb => {
                        thumb.addEventListener('click', () => {
                            const idx = parseInt(thumb.getAttribute('data-index'), 10);
                            if (!images[idx]) return;
                            activeImageIndex = idx;
                            window.__wpShowImage(idx);
                            thumbStrip.querySelectorAll('.thumb-item').forEach(t => t.classList.remove('active'));
                            thumb.classList.add('active');
                        });
                    });
                }
                // 🛡️ 상품 사진 워터마크 + 복사 방지(우클릭·끌기·길게눌러 저장 차단)
                WithPlus.protectImages(document);
                if (mainImageEl) WithPlus.applyWatermark(mainImageEl);
                if (thumbStrip) thumbStrip.classList.add('wp-protect');
                // 사진이 아닌 주소(상품 페이지 링크 등)가 섞여 있어 빈 칸으로 보이는 작은 사진은 자동으로 뺀다
                if (thumbStrip) {
                    Array.from(thumbStrip.querySelectorAll('.thumb-item')).forEach(function (t) {
                        const u = images[parseInt(t.getAttribute('data-index'), 10)];
                        if (!u) return;
                        const probe = new Image();
                        probe.onerror = function () {
                            t.remove();
                            const k = images.indexOf(u);
                            if (k > 0) images.splice(k, 1);
                            Array.from(thumbStrip.querySelectorAll('.thumb-item')).forEach(function (x, j) { x.setAttribute('data-index', j); });
                            if (thumbStrip.querySelectorAll('.thumb-item').length < 2) thumbStrip.style.display = 'none';
                        };
                        probe.src = u;
                    });
                }
                // 상세 사진은 번잡하지 않게 첫 사진(위)과 마지막 사진(아래)에만 작은 로고를 얹는다
                (function () {
                    const imgs = Array.from(wrap.querySelectorAll('.detail-section-block img'));
                    if (!imgs.length) return;
                    const pick = imgs.length > 1 ? [imgs[0], imgs[imgs.length - 1]] : [imgs[0]];
                    pick.forEach((img, i) => {
                        WithPlus.watermarkImage(img);
                        const m = img.parentNode && img.parentNode.querySelector(':scope > .wp-wm');
                        if (m) { m.classList.add('wp-wm-lite'); if (i === 0 && pick.length > 1) m.classList.add('is-top'); }
                    });
                })();
                if (mainImageEl && images.length > 0) {
                    const lightboxOverlay = document.getElementById('lightbox-overlay');
                    const lightboxImg = document.getElementById('lightbox-img');
                    const lightboxClose = document.getElementById('lightbox-close');
                    WithPlus.watermarkImage(lightboxImg);
                    mainImageEl.addEventListener('click', () => {
                        lightboxImg.src = images[activeImageIndex];
                        lightboxOverlay.classList.add('open');
                    });
                    lightboxClose.addEventListener('click', () => lightboxOverlay.classList.remove('open'));
                    lightboxOverlay.addEventListener('click', (e) => { if (e.target === lightboxOverlay) lightboxOverlay.classList.remove('open'); });
                }

                // 수량 조절 - 옵션이 있는 상품은 선택된 옵션의 재고를, 없으면 상품 전체 재고를 상한으로 쓴다
                const qtyInput = document.getElementById('qty-input');
                let selectedVariantId = null;
                let selectedVariantStock = Number(p.stock) || 99;
                function currentMaxQty() {
                    const stockMax = hasVariants ? selectedVariantStock : (Number(p.stock) || 99);
                    return flash ? Math.max(1, Math.min(stockMax, Number(flash.remaining) || 1)) : stockMax; // 초특가는 잔여 수량까지만
                }
                document.getElementById('qty-minus').addEventListener('click', () => {
                    qtyInput.value = Math.max(1, parseInt(qtyInput.value, 10) - 1);
                });
                document.getElementById('qty-plus').addEventListener('click', () => {
                    qtyInput.value = Math.min(currentMaxQty(), parseInt(qtyInput.value, 10) + 1);
                });

                // 옵션 선택 시 가격/재고/버튼 활성화 상태를 실시간으로 갱신
                const variantSelectEl = document.getElementById('variant-select');
                const cartBtn = document.getElementById('detail-cart-btn');
                const buyBtn = document.getElementById('detail-buy-btn');
                const priceEl = document.querySelector('.detail-price');
                const stockInfoEl = document.getElementById('stock-info-text');
                const shippingBadgeEl = document.getElementById('shipping-badge-text');
                if (variantSelectEl) {
                    variantSelectEl.addEventListener('change', () => {
                        const opt = variantSelectEl.selectedOptions[0];
                        selectedVariantId = variantSelectEl.value || null;
                        selectedVariantStock = Number(opt.dataset.stock || 0);
                        const adjustment = Number(opt.dataset.adjustment || 0);
                        const adjustedPrice = Number(currentPrice) + adjustment;
                        priceEl.textContent = WithPlus.formatPrice(adjustedPrice);
                        qtyInput.value = 1;

                        if (selectedVariantStock <= 0) {
                            stockInfoEl.textContent = '❌ 선택한 옵션은 품절입니다';
                            cartBtn.disabled = true;
                            buyBtn.disabled = true;
                        } else {
                            stockInfoEl.textContent = `✅ 재고 ${selectedVariantStock}개 남음 | 배송비 무료`;
                            cartBtn.disabled = false;
                            buyBtn.disabled = false;
                        }
                        if (shippingBadgeEl) shippingBadgeEl.textContent = WithPlus.getShippingBadgeLabel(selectedVariantStock) || '';
                    });
                }

                // 구매수량별 가격 옵션 목록 렌더링 - 선택한 행의 수량이 곧 구매 수량이 된다
                const tierListEl = document.getElementById('qty-tier-list');
                let selectedTierQty = 1;
                function renderTierList() {
                    if (!tierListEl) return;
                    const adj = (variantSelectEl && variantSelectEl.value) ? Number((variantSelectEl.selectedOptions[0] || {}).dataset.adjustment || 0) : 0;
                    const unit1 = WithPlus.getEffectiveUnitPrice(p) + adj;
                    const maxQty = currentMaxQty();
                    const rows = tierOptions.map(t => {
                        const total = t.price + adj * t.qty;
                        return { ...t, total, perUnit: total / t.qty };
                    });
                    const minPer = Math.min(...rows.map(r => r.perUnit));
                    const bestCount = rows.filter(r => r.perUnit === minPer).length;
                    if (!rows.some(r => r.qty === selectedTierQty && r.qty <= maxQty)) {
                        const firstOk = rows.find(r => r.qty <= maxQty);
                        selectedTierQty = firstOk ? firstOk.qty : rows[0].qty;
                    }
                    tierListEl.innerHTML = rows.map(r => {
                        const disabled = r.qty > maxQty;
                        const discount = unit1 > 0 ? Math.round((1 - r.perUnit / unit1) * 100) : 0;
                        const isBest = rows.length > 1 && bestCount < rows.length && r.perUnit === minPer;
                        const name = r.label ? WithPlus.escapeHtml(r.label) : `${r.qty}개`;
                        return `
                        <label class="qty-tier-row${r.qty === selectedTierQty ? ' selected' : ''}${disabled ? ' disabled' : ''}" data-qty="${r.qty}">
                            <input type="radio" name="qty-tier" value="${r.qty}" ${r.qty === selectedTierQty ? 'checked' : ''} ${disabled ? 'disabled' : ''}>
                            <span class="qty-tier-main">
                                <span class="qty-tier-name">${name}${r.label ? ` <span style="font-weight:400; color:#777; font-size:.85em;">(${r.qty}개)</span>` : ''}</span>
                                ${r.badge ? `<span class="qty-tier-badge">${WithPlus.escapeHtml(r.badge)}</span>` : ''}
                                <span class="qty-tier-unit">개당 ${WithPlus.formatPrice(Math.round(r.perUnit))}${isBest ? ' · <span class="best">최저 단위가</span>' : ''}${disabled ? ' · 재고 부족' : ''}</span>
                            </span>
                            <span class="qty-tier-price">${WithPlus.formatPrice(r.total)}${discount > 0 ? `<small>${discount}% 할인</small>` : ''}</span>
                        </label>`;
                    }).join('');
                    qtyInput.value = selectedTierQty;
                    if (window.__wpRecalcTotal) window.__wpRecalcTotal();
                }
                if (tierListEl) {
                    tierListEl.addEventListener('change', (e) => {
                        if (e.target && e.target.name === 'qty-tier') {
                            selectedTierQty = Number(e.target.value) || 1;
                            renderTierList();
                        }
                    });
                    if (variantSelectEl) variantSelectEl.addEventListener('change', () => { selectedTierQty = 1; renderTierList(); });
                    renderTierList();
                }
                // 묶음 선택 상품은 장바구니 수량을 "선택한 묶음 수량"으로 맞춘다 (기존 수량에 더해져 묶음가가 깨지지 않게)
                function putIntoCart() {
                    const qty = parseInt(qtyInput.value, 10) || 1;
                    if (hasTiers) {
                        const exists = WithPlus.getCart().some(i => i.product_id === p.id && (i.variant_id || null) === (selectedVariantId || null));
                        if (exists) WithPlus.setCartQty(p.id, qty, selectedVariantId);
                        else WithPlus.addToCart(p.id, qty, selectedVariantId);
                    } else {
                        WithPlus.addToCart(p.id, qty, selectedVariantId);
                    }
                }

                // 장바구니 담기 (실제 localStorage 장바구니에 저장)
                document.getElementById('detail-cart-btn').addEventListener('click', function () {
                    if (hasVariants && !selectedVariantId) return;
                    putIntoCart();
                    this.textContent = '✓ 담겼습니다';
                    setTimeout(() => { this.textContent = '장바구니 담기'; }, 2000);
                });

                // 바로 구매: 장바구니에 담고 바로 장바구니 페이지로 이동 (거기서 로그인 확인 후 주문)
                document.getElementById('detail-buy-btn').addEventListener('click', function () {
                    if (hasVariants && !selectedVariantId) return;
                    putIntoCart();
                    location.href = '/cart';
                });

                // 재구매 알림 딥링크(?reorder=1)로 들어온 경우 바로 장바구니에 담아준다 ("쿠팡 바로구매" 경험).
                // 옵션이 있는 상품은 어떤 옵션인지 알 수 없으므로 자동으로 담지 않고 옵션 선택을 안내만 한다.
                if (new URLSearchParams(location.search).get('reorder') === '1' && !outOfStock) {
                    if (!hasVariants) {
                        WithPlus.addToCart(p.id, 1, null);
                        const cartBtnEl = document.getElementById('detail-cart-btn');
                        if (cartBtnEl) { cartBtnEl.textContent = '✓ 장바구니에 다시 담았습니다'; setTimeout(() => { cartBtnEl.textContent = '장바구니 담기'; }, 3000); }
                    } else {
                        const stockInfoEl2 = document.getElementById('stock-info-text');
                        if (stockInfoEl2) stockInfoEl2.textContent = '다시 구매하시려면 옵션을 선택해주세요';
                    }
                }

                // 재입고 알림 신청 (품절 상품에만 표시됨)
                const restockBtn = document.getElementById('restock-notify-btn');
                if (restockBtn) {
                    const restockMsg = document.getElementById('restock-notify-msg');
                    restockBtn.addEventListener('click', async () => {
                        const session = await WithPlus.getSession();
                        if (!session) {
                            restockMsg.textContent = '로그인 후 신청할 수 있습니다. 로그인 페이지로 이동합니다...';
                            setTimeout(() => { location.href = '/login'; }, 900);
                            return;
                        }
                        restockBtn.disabled = true;
                        restockBtn.textContent = '신청 중...';
                        try {
                            const token = await WithPlus.getAccessToken();
                            const res = await fetch(`/api/products/${p.id}/restock-notify`, {
                                method: 'POST', headers: { 'Authorization': 'Bearer ' + token }
                            });
                            const json = await res.json();
                            if (!res.ok || !json.success) throw new Error(json.message || '신청에 실패했습니다');
                            restockBtn.textContent = '🔔 신청 완료';
                            restockMsg.textContent = '재입고되면 마이페이지 알림함에서 확인하실 수 있어요.';
                        } catch (err) {
                            restockBtn.disabled = false;
                            restockBtn.textContent = '🔔 재입고 알림 신청';
                            restockMsg.textContent = err.message;
                        }
                    });
                }

                // 🔄 정기배송 신청 (관리자가 "정기배송 가능"으로 설정한 상품에만 표시됨)
                // - 신청/일정 관리 기능만 구현되어 있습니다(자동결제·자동주문생성은 하지 않습니다).
                const subToggleBtn = document.getElementById('subscribe-toggle-btn');
                if (subToggleBtn) {
                    const subForm = document.getElementById('subscribe-form');
                    const subMsg = document.getElementById('subscribe-msg');
                    const subAddrSelect = document.getElementById('sub-address-select');
                    const subAddrManual = document.getElementById('subscribe-address-manual');
                    let addressesLoaded = false;

                    subToggleBtn.addEventListener('click', async () => {
                        const session = await WithPlus.getSession();
                        if (!session) {
                            location.href = '/login';
                            return;
                        }
                        subForm.classList.toggle('open');
                        if (subForm.classList.contains('open') && !addressesLoaded) {
                            addressesLoaded = true;
                            try {
                                const token = await WithPlus.getAccessToken();
                                const res = await fetch('/api/me/addresses', { headers: { 'Authorization': 'Bearer ' + token } });
                                const json = await res.json();
                                const addresses = (res.ok && json.success) ? json.data : [];
                                const options = addresses.map(a => `<option value="${a.id}">${WithPlus.escapeHtml(a.label || '배송지')} - ${WithPlus.escapeHtml(a.receiver_name)} (${WithPlus.escapeHtml(a.address)})</option>`).join('');
                                subAddrSelect.innerHTML = options + `<option value="__manual__">+ 새 배송지 직접 입력</option>`;
                                if (addresses.length === 0) {
                                    subAddrSelect.value = '__manual__';
                                    subAddrManual.classList.add('open');
                                }
                            } catch (err) {
                                subAddrSelect.innerHTML = `<option value="__manual__">+ 새 배송지 직접 입력</option>`;
                                subAddrManual.classList.add('open');
                            }
                        }
                    });

                    subAddrSelect.addEventListener('change', () => {
                        subAddrManual.classList.toggle('open', subAddrSelect.value === '__manual__');
                    });

                    subForm.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        subMsg.className = 'subscribe-msg';
                        const submitBtn = document.getElementById('subscribe-submit-btn');
                        const payload = {
                            product_id: p.id,
                            quantity: document.getElementById('sub-quantity').value,
                            cycle_days: document.getElementById('sub-cycle').value
                        };
                        if (subAddrSelect.value && subAddrSelect.value !== '__manual__') {
                            payload.shipping_address_id = subAddrSelect.value;
                        } else {
                            payload.recipient_name = document.getElementById('sub-recipient-name').value.trim();
                            payload.recipient_phone = document.getElementById('sub-recipient-phone').value.trim();
                            payload.address = document.getElementById('sub-address').value.trim();
                            payload.address_detail = document.getElementById('sub-address-detail').value.trim();
                        }
                        submitBtn.disabled = true;
                        submitBtn.textContent = '신청 중...';
                        try {
                            const token = await WithPlus.getAccessToken();
                            const res = await fetch('/api/subscriptions', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                                body: JSON.stringify(payload)
                            });
                            const json = await res.json();
                            if (!res.ok || !json.success) throw new Error(json.message || '신청에 실패했습니다');
                            subMsg.textContent = json.message + ' 마이페이지에서 확인/관리하실 수 있어요.';
                            subMsg.className = 'subscribe-msg success';
                            subForm.reset();
                        } catch (err) {
                            subMsg.textContent = err.message;
                            subMsg.className = 'subscribe-msg error';
                        } finally {
                            submitBtn.disabled = false;
                            submitBtn.textContent = '정기배송 신청하기';
                        }
                    });
                }

                // 🛒 함께 구매한 상품 (동시구매 분석) - 데이터가 충분하지 않으면 섹션 자체를 숨김
                (async () => {
                    try {
                        // WithPlus.fetchJSON: 채널별 자동 가격(공동체가/도매가) 반영
                        const { ok: resOk, json } = await WithPlus.fetchJSON(`/api/products/${p.id}/frequently-bought-together?limit=6`);
                        if (!resOk || !json.success || !json.data || json.data.length === 0) return;
                        const section = document.getElementById('fbt-section');
                        const scroll = document.getElementById('fbt-scroll');
                        scroll.innerHTML = json.data.map(fp => {
                            const fImg = Array.isArray(fp.images_urls) && fp.images_urls.length > 0 ? fp.images_urls[0] : null;
                            const fEmoji = (WithPlus.CATEGORY_EMOJI && (WithPlus.CATEGORY_EMOJI[fp.category] || WithPlus.CATEGORY_EMOJI.default)) || '🛍️';
                            const fHasDiscount = fp.discount_price && Number(fp.discount_price) < Number(fp.price);
                            const fPrice = fHasDiscount ? fp.discount_price : fp.price;
                            return `
                            <a class="fbt-card" href="/product/${WithPlus.escapeHtml(fp.id)}">
                                <div class="fbt-image" ${fImg ? `style="background-image:url('${WithPlus.safeUrlAttr(fImg)}');"` : ''}>${fImg ? '' : fEmoji}</div>
                                <div class="fbt-name">${WithPlus.escapeHtml(fp.name)}</div>
                                <div class="fbt-price">${WithPlus.formatPrice(fPrice)}</div>
                            </a>`;
                        }).join('');
                        section.style.display = '';
                    } catch (err) { /* 실패해도 상품 상세 화면 전체에는 지장 없음 */ }
                })();

                // 🔎 비슷한 상품 (카테고리+가격대+브랜드 기반 규칙 유사도) - 주문 이력이 없는 신상품에도 바로 동작함
                (async () => {
                    try {
                        // WithPlus.fetchJSON: 채널별 자동 가격(공동체가/도매가) 반영
                        const { ok: resOk, json } = await WithPlus.fetchJSON(`/api/products/${p.id}/similar?limit=8`);
                        if (!resOk || !json.success || !json.data || json.data.length === 0) return;
                        const section = document.getElementById('similar-products-section');
                        const scroll = document.getElementById('similar-products-scroll');
                        scroll.innerHTML = json.data.map(sp => {
                            const simImg = Array.isArray(sp.images_urls) && sp.images_urls.length > 0 ? sp.images_urls[0] : null;
                            const simEmoji = (WithPlus.CATEGORY_EMOJI && (WithPlus.CATEGORY_EMOJI[sp.category] || WithPlus.CATEGORY_EMOJI.default)) || '🛍️';
                            const simHasDiscount = sp.discount_price && Number(sp.discount_price) < Number(sp.price);
                            const simPrice = simHasDiscount ? sp.discount_price : sp.price;
                            return `
                            <a class="fbt-card" href="/product/${WithPlus.escapeHtml(sp.id)}">
                                <div class="fbt-image" ${simImg ? `style="background-image:url('${WithPlus.safeUrlAttr(simImg)}');"` : ''}>${simImg ? '' : simEmoji}</div>
                                <div class="fbt-name">${WithPlus.escapeHtml(sp.name)}</div>
                                <div class="fbt-price">${WithPlus.formatPrice(simPrice)}</div>
                            </a>`;
                        }).join('');
                        section.style.display = '';
                    } catch (err) { /* 실패해도 상품 상세 화면 전체에는 지장 없음 */ }
                })();

                // 💰 가격 비교/최저가 이력 (제안서 6절) - 지금 가격이 최근 90일 중 최저가인지 정직하게 보여준다.
                // 스냅샷이 아직 없는(막 등록된) 상품은 API가 지금 가격을 기준으로 "최저가"라고 응답하므로 자연스럽게 배지가 뜬다.
                (async () => {
                    try {
                        const res = await fetch(`/api/products/${p.id}/price-history?days=90`);
                        const json = await res.json();
                        if (!res.ok || !json.success) return;
                        const badge = document.getElementById('price-history-badge');
                        if (!badge) return;
                        const { is_lowest, lowest_price, current_price, history } = json.data;
                        // 가격 이력은 기본가 기준 - 공동체가는 같은 비율로 환산해 보여주고, 도매가는 별도 가격 체계라 배지를 띄우지 않는다
                        const priceCtx = await WithPlus.loadPriceContext();
                        if (priceCtx && priceCtx.mode === 'wholesale') return;
                        if (history.length === 0 && is_lowest) return; // 비교할 과거 이력 자체가 없으면 굳이 배지를 띄우지 않는다
                        if (is_lowest) {
                            badge.textContent = '📉 최근 90일 중 최저가예요!';
                            badge.style.color = 'var(--primary-color)';
                            badge.style.fontWeight = '600';
                        } else if (Number(lowest_price) > 0) {
                            const diffPercent = Math.round(((Number(current_price) - Number(lowest_price)) / Number(lowest_price)) * 100);
                            badge.textContent = `최근 90일 최저가(${WithPlus.formatPrice(WithPlus.adjustPrice(lowest_price, priceCtx))}) 대비 ${diffPercent}% 높아요`;
                        }
                    } catch (err) { /* 실패해도 상품 상세 화면 전체에는 지장 없음 */ }
                })();

                // 🏭 이 공급사의 다른 상품 - 공급자 계정이 등록한 상품일 때만(관리자가 직접 등록한 상품 등 공급자가 없으면 조용히 숨김),
                // 그리고 그 공급자의 판매중인 다른 상품이 실제로 있을 때만 섹션을 보여준다.
                (async () => {
                    try {
                        // WithPlus.fetchJSON: 채널별 자동 가격(공동체가/도매가) 반영
                        const { ok: resOk, json } = await WithPlus.fetchJSON(`/api/products/${p.id}/supplier-products?limit=8`);
                        if (!resOk || !json.success || !json.supplier || !json.data || json.data.length === 0) return;
                        const section = document.getElementById('supplier-products-section');
                        const titleEl = document.getElementById('supplier-products-title');
                        const scroll = document.getElementById('supplier-products-scroll');
                        titleEl.textContent = `🏭 ${json.supplier.name}님의 다른 상품 (총 ${json.supplier.product_count}개)`;
                        scroll.innerHTML = json.data.map(sp => {
                            const sImg = Array.isArray(sp.images_urls) && sp.images_urls.length > 0 ? sp.images_urls[0] : null;
                            const sEmoji = (WithPlus.CATEGORY_EMOJI && (WithPlus.CATEGORY_EMOJI[sp.category] || WithPlus.CATEGORY_EMOJI.default)) || '🛍️';
                            const sHasDiscount = sp.discount_price && Number(sp.discount_price) < Number(sp.price);
                            const sPrice = sHasDiscount ? sp.discount_price : sp.price;
                            return `
                            <a class="fbt-card" href="/product/${WithPlus.escapeHtml(sp.id)}">
                                <div class="fbt-image" ${sImg ? `style="background-image:url('${WithPlus.safeUrlAttr(sImg)}');"` : ''}>${sImg ? '' : sEmoji}</div>
                                <div class="fbt-name">${WithPlus.escapeHtml(sp.name)}</div>
                                <div class="fbt-price">${WithPlus.formatPrice(sPrice)}</div>
                            </a>`;
                        }).join('');
                        section.style.display = '';
                    } catch (err) { /* 실패해도 상품 상세 화면 전체에는 지장 없음 */ }
                })();

                // 품절 안내 팝업 + 구매 버튼 "품절" 잠금 (soldout-popup.js)
                if (outOfStock && window.WPSoldout) WPSoldout.show(p);

                // 리뷰 작성 영역: 로그인 상태에 따라 작성 폼 또는 로그인 안내 표시
                await renderReviewWriteArea(p.id);

            } catch (err) {
                wrap.innerHTML = `
                    <div class="state-box">
                        <div class="emoji">⚠️</div>
                        <h3>상품 정보를 불러오는 중 문제가 발생했습니다</h3>
                        <p>${WithPlus.escapeHtml(err.message)}</p>
                        <a href="/">홈으로 돌아가기</a>
                    </div>`;
            }

            // 리뷰 작성 폼 (로그인 사용자만) / 로그인 안내 (비로그인)
            async function renderReviewWriteArea(productId) {
                const area = document.getElementById('review-write-area');
                if (!area) return;

                const session = await WithPlus.getSession();
                if (!session) {
                    area.innerHTML = `<div class="review-login-prompt">리뷰를 작성하려면 <a href="/login">로그인</a>이 필요합니다.</div>`;
                    return;
                }

                // 이 상품이 포함된 배송완료 주문이 있으면 "구매인증" 리뷰로 등록할 수 있도록 찾아둔다
                // (서버가 실제로 다시 검증하므로, 여기서는 화면에 옵션을 보여줄지 결정하는 용도일 뿐이다)
                let verifiedOrderId = null;
                try {
                    const token = await WithPlus.getAccessToken();
                    const ordersRes = await fetch('/api/orders', { headers: { 'Authorization': 'Bearer ' + token } });
                    const ordersJson = await ordersRes.json();
                    if (ordersJson.success) {
                        const eligible = (ordersJson.data || []).find(o => o.status === 'delivered' && Array.isArray(o.items) && o.items.some(i => i.product_id === productId));
                        if (eligible) verifiedOrderId = eligible.id;
                    }
                } catch (e) { /* 주문 조회가 실패해도 리뷰 작성 자체는 계속 가능해야 하므로 조용히 넘어간다 */ }

                area.innerHTML = `
                    <div class="review-form">
                        <div class="star-rating" id="review-stars">
                            ${[1, 2, 3, 4, 5].map(n => `<span class="star" data-value="${n}">★</span>`).join('')}
                        </div>
                        <textarea id="review-comment" placeholder="이 상품에 대한 솔직한 후기를 남겨주세요"></textarea>
                        <br>
                        ${verifiedOrderId ? `<label style="display:flex; align-items:center; gap:6px; font-size:0.85em; margin:8px 0; color:var(--text-gray);"><input type="checkbox" id="review-verified-check" checked> ✅ 구매인증 리뷰로 등록 (배송완료된 주문 확인됨)</label>` : ''}
                        <button class="review-submit-btn" id="review-submit-btn">리뷰 등록</button>
                        <div class="review-msg" id="review-msg"></div>
                    </div>`;

                let selectedRating = 0;
                const stars = area.querySelectorAll('.star-rating .star');
                stars.forEach(star => {
                    star.addEventListener('click', () => {
                        selectedRating = parseInt(star.getAttribute('data-value'), 10);
                        stars.forEach(s => {
                            s.classList.toggle('active', parseInt(s.getAttribute('data-value'), 10) <= selectedRating);
                        });
                    });
                });

                document.getElementById('review-submit-btn').addEventListener('click', async function () {
                    const btn = this;
                    const msg = document.getElementById('review-msg');
                    msg.className = 'review-msg';
                    const comment = document.getElementById('review-comment').value.trim();

                    if (selectedRating < 1) {
                        msg.textContent = '별점을 선택해주세요.';
                        msg.className = 'review-msg error';
                        return;
                    }
                    if (!comment) {
                        msg.textContent = '리뷰 내용을 입력해주세요.';
                        msg.className = 'review-msg error';
                        return;
                    }

                    btn.disabled = true;
                    btn.textContent = '등록 중...';

                    try {
                        const token = await WithPlus.getAccessToken();
                        const verifiedCheck = document.getElementById('review-verified-check');
                        const useOrderId = (verifiedOrderId && (!verifiedCheck || verifiedCheck.checked)) ? verifiedOrderId : null;
                        const res = await fetch('/api/reviews', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                            body: JSON.stringify({ product_id: productId, order_id: useOrderId, rating: selectedRating, comment })
                        });
                        const json = await res.json();
                        if (!res.ok || !json.success) throw new Error(json.message || '리뷰 등록에 실패했습니다');

                        msg.textContent = '리뷰가 등록되었습니다. 감사합니다!';
                        msg.className = 'review-msg success';

                        // 새 리뷰를 목록 맨 위에 즉시 반영 (전체 새로고침 없이)
                        const list = document.getElementById('reviews-list');
                        const newItemHtml = WithPlus.renderReviewItem(Object.assign({ rating: selectedRating, comment, created_at: new Date().toISOString() }, json.data)); // 서버가 돌려준 가린 아이디(author_name) 포함
                        if (list.querySelector('p')) list.innerHTML = '';
                        list.insertAdjacentHTML('afterbegin', newItemHtml);

                        document.getElementById('review-comment').value = '';
                        selectedRating = 0;
                        stars.forEach(s => s.classList.remove('active'));
                        btn.disabled = false;
                        btn.textContent = '리뷰 등록';
                    } catch (err) {
                        msg.textContent = err.message;
                        msg.className = 'review-msg error';
                        btn.disabled = false;
                        btn.textContent = '리뷰 등록';
                    }
                });
            }
        })();
    </script>
</body>
</html>
