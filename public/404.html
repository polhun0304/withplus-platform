<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 설치형 앱(PWA) 표준 v1 -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#D32F5B">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="WITH+">
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/icon/apple">
    <script src="/pwa-install.js" defer></script>
    <title>페이지를 찾을 수 없습니다 - WITH+</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #FFFFFF;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .box .emoji { font-size: 4em; margin-bottom: 20px; }
        .box h1 { font-size: 1.6em; margin-bottom: 10px; }
        .box p { color: #666; margin-bottom: 30px; }
        .box a {
            display: inline-block;
            padding: 12px 32px;
            background: #D32F5B;
            color: white;
            text-decoration: none;
            border-radius: 24px;
            font-weight: 600;
        }
        .box a:hover { background: #B0154F; }
    </style>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="/typography.css">
</head>
<body>
    <div class="box">
        <div class="emoji">🔍</div>
        <h1>페이지를 찾을 수 없습니다</h1>
        <p>요청하신 페이지가 존재하지 않거나 이동되었습니다.</p>
        <a href="/">WITH+ 홈으로 돌아가기</a>
    </div>
</body>
</html>
