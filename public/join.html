<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 설치형 앱(PWA) 표준 v1 -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#D32F5B">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="WITH+">
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/icon/apple">
    <script src="/pwa-install.js" defer></script>
    <script src="/voice-dictation.js?v=1" defer></script>
    <title>회원가입 - WITH+</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary-color: #D32F5B; --primary-dark: #B0154F; --bg-light: #F5F5F5; --text-dark: #333; --text-gray: #666; --border-color: #E0E0E0; }
        body { font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text-dark); }
        .top-logo { text-align: center; padding: 30px 20px 10px; }
        .top-logo a { font-size: 1.8em; font-weight: bold; color: var(--primary-color); text-decoration: none; }
        .auth-wrap { max-width: 420px; margin: 20px auto 80px; padding: 0 20px; }
        .auth-box { background: white; border: 1px solid var(--border-color); border-radius: 16px; padding: 40px 30px; }
        .auth-box h1 { font-size: 1.4em; text-align: center; margin-bottom: 6px; }
        .auth-box .sub { text-align: center; color: var(--text-gray); font-size: 0.85em; margin-bottom: 25px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 0.85em; color: var(--text-gray); margin-bottom: 6px; }
        .field input { width: 100%; padding: 12px 14px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1em; }
        .field input:focus { outline: none; border-color: var(--primary-color); }
        .field .hint { font-size: 0.78em; color: #757575; margin-top: 4px; }
        .submit-btn { width: 100%; padding: 14px; background: var(--primary-color); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 1em; cursor: pointer; margin-top: 8px; }
        .submit-btn:hover { background: var(--primary-dark); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg { margin-top: 14px; font-size: 0.9em; padding: 10px 12px; border-radius: 8px; display: none; }
        .msg.error { display: block; background: #FDECEA; color: #C62828; }
        .msg.success { display: block; background: #E8F5E9; color: #2E7D32; }
        /* 약관 동의 */
        .agree-box { border: 1px solid var(--border-color); border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; background: #fff; }
        .agree-box input[type=checkbox] { width: 18px; height: 18px; flex-shrink: 0; margin: 0; accent-color: var(--primary-color); }
        .agree-all { display: flex; align-items: center; gap: 8px; font-size: 0.95em; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
        .agree-all small { color: var(--text-gray); font-weight: 400; }
        .agree-list { display: grid; gap: 8px; padding-top: 10px; }
        .agree-item { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; font-size: 0.84em; line-height: 1.45; color: var(--text-dark); }
        .agree-item label, label.agree-item { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; margin: 0; min-width: 0; }
        label.agree-item { justify-content: flex-start; }
        .agree-item em { font-style: normal; font-weight: 700; color: var(--primary-color); }
        .agree-item em.opt { color: var(--text-gray); }
        .agree-view { flex-shrink: 0; font-size: 0.95em; color: var(--text-gray); text-decoration: underline; background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; }
        .agree-detail { font-size: 0.78em; color: var(--text-gray); background: var(--bg-light); border-radius: 8px; padding: 10px; }
        .agree-detail table { width: 100%; border-collapse: collapse; margin-bottom: 6px; }
        .agree-detail th { text-align: left; white-space: nowrap; padding: 3px 8px 3px 0; vertical-align: top; color: var(--text-dark); }
        .agree-detail td { padding: 3px 0; }
        .agree-detail p { margin: 0; }
        .agree-msg { display: none; margin-top: 10px; font-size: 0.84em; color: #C62828; }
        .agree-msg.show { display: block; }
        .agree-box.need { border-color: #E57373; }
        .links-row { text-align: center; margin-top: 20px; font-size: 0.9em; color: var(--text-gray); }
        .links-row a { color: var(--primary-color); text-decoration: none; font-weight: 600; }
        .back-home { text-align: center; margin-top: 16px; }
        .back-home a { color: var(--text-gray); text-decoration: none; font-size: 0.85em; }
        .quick-join { margin: 6px 0 18px; display: grid; gap: 8px; }
        .qj-btn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-weight: 700; font-size: 0.98em; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .qj-btn.kakao { background: #FEE500; color: #191919; }
        .qj-btn.naver { background: #03C75A; color: #fff; }
        .qj-btn.is-soon { opacity: .55; }
        .qj-btn .soon-badge { font-size: 0.72em; background: rgba(0,0,0,.12); border-radius: 999px; padding: 2px 8px; }
        .qj-msg { display: none; font-size: 0.85em; color: #C62828; text-align: center; }
        .qj-or { display: flex; align-items: center; gap: 10px; color: var(--text-gray); font-size: 0.82em; margin-top: 6px; }
        .qj-or::before, .qj-or::after { content: ''; flex: 1; height: 1px; background: var(--border-color); }
    </style>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="/typography.css">
</head>
<body>
    <div class="top-logo"><a href="/" aria-label="WITH+ 홈"><img src="/images/brand/withplus-logo.webp" alt="WITH+" class="wp-logo-img" width="143" height="44" style="height:44px;margin:0 auto;"><span class="wp-logo-tagline">함께할수록 <b>더해지는 가치</b></span></a></div>
    <div class="auth-wrap">
        <div class="auth-box">
            <h1>회원가입</h1>
            <div class="sub">WITH+ 회원이 되고 마일리지 혜택을 받아보세요</div>
            <!-- 약관 동의: 이메일 가입·카카오/네이버 가입 모두 필수 항목에 동의해야 진행 -->
            <div class="agree-box" id="agree-box">
                <label class="agree-all"><input type="checkbox" id="agree-all"> <b>전체 동의</b> <small>(선택 항목 포함)</small></label>
                <div class="agree-list">
                    <label class="agree-item"><input type="checkbox" class="agree-req" id="agree-age"> <span><em>[필수]</em> 만 14세 이상입니다</span></label>
                    <div class="agree-item"><label><input type="checkbox" class="agree-req" id="agree-terms"> <span><em>[필수]</em> 이용약관 동의</span></label><a href="/terms" target="_blank" rel="noopener" class="agree-view">보기</a></div>
                    <div class="agree-item"><label><input type="checkbox" class="agree-req" id="agree-privacy"> <span><em>[필수]</em> 개인정보 수집·이용 동의</span></label><button type="button" class="agree-view" id="agree-privacy-toggle" aria-expanded="false" aria-controls="agree-privacy-detail">보기</button></div>
                    <div class="agree-detail" id="agree-privacy-detail" hidden>
                        <table>
                            <tr><th>목적</th><td>회원 가입·관리, 주문·결제·배송, 고객 문의 응대</td></tr>
                            <tr><th>항목</th><td>이메일 주소, 비밀번호 (소셜 가입 시 해당 계정의 회원 식별값·이메일·이름·닉네임)</td></tr>
                            <tr><th>보유 기간</th><td>회원 탈퇴 시까지 (법령상 보존 기간이 있는 거래 기록은 그 기간까지)</td></tr>
                        </table>
                        <p>동의를 거부할 수 있으나, 거부하면 회원가입을 할 수 없습니다. 자세한 내용은 <a href="/privacy" target="_blank" rel="noopener">개인정보처리방침</a>을 확인해주세요.</p>
                    </div>
                    <label class="agree-item"><input type="checkbox" id="marketing-consent"> <span><em class="opt">[선택]</em> 마케팅 정보 수신 동의 — 혜택·이벤트 안내 (가입 후 마이페이지에서 언제든 변경)</span></label>
                </div>
                <div class="agree-msg" id="agree-msg" role="alert"></div>
            </div>
            <div class="quick-join">
                <button type="button" class="qj-btn kakao" id="join-kakao-btn">💬 카카오로 3초 가입<span class="soon-badge">준비중</span></button>
                <button type="button" class="qj-btn naver" id="join-naver-btn">N 네이버로 3초 가입<span class="soon-badge">준비중</span></button>
                <div class="qj-msg" id="join-social-msg"></div>
                <div class="qj-or"><span>또는 이메일로 가입</span></div>
            </div>
            <form id="join-form">
                <div class="field">
                    <label for="email">이메일</label>
                    <input type="email" id="email" required autocomplete="email">
                </div>
                <div class="field">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" required autocomplete="new-password" minlength="6">
                    <div class="hint">6자 이상 입력해주세요</div>
                </div>
                <div class="field">
                    <label for="password2">비밀번호 확인</label>
                    <input type="password" id="password2" required autocomplete="new-password" minlength="6">
                </div>
                <div class="field" id="referral-field" style="display:none;">
                    <label for="referral-code">추천인 코드 (선택)</label>
                    <input type="text" id="referral-code" placeholder="추천받은 코드가 있다면 입력해주세요" maxlength="20" style="text-transform:uppercase;">
                </div>
                <button type="submit" class="submit-btn" id="submit-btn">회원가입</button>
                <div class="msg" id="msg"></div>
            </form>
            <div class="links-row">이미 회원이신가요? <a href="/login">로그인</a></div>
        </div>
        <div class="back-home"><a href="/">← 홈으로 돌아가기</a></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/withplus-pricing.js"></script>
    <script src="/withplus-common.js"></script>
    <script>
        (async function () {
            const session = await WithPlus.getSession();
            if (session) { WithPlus.goAfterLogin(); return; }

            const form = document.getElementById('join-form');
            const msg = document.getElementById('msg');
            const submitBtn = document.getElementById('submit-btn');
            const referralField = document.getElementById('referral-field');
            const referralInput = document.getElementById('referral-code');

            // 추천 링크(?ref=코드)로 들어왔으면 입력란을 보여주고 자동으로 채워둔다. 링크 없이 들어온 경우에도
            // 추천인 프로그램이 켜져 있으면(형님이 관리자에서 활성화한 경우) 직접 입력할 수 있도록 항상 보여준다.
            try {
                const refFromUrl = new URLSearchParams(location.search).get('ref');
                if (refFromUrl) {
                    referralInput.value = refFromUrl.trim().toUpperCase();
                    referralField.style.display = '';
                } else {
                    const res = await fetch('/api/settings/referral-program');
                    const json = await res.json();
                    if (res.ok && json.success && json.data.enabled) referralField.style.display = '';
                }
            } catch (e) { /* 추천인 프로그램 상태 조회 실패는 조용히 무시 - 가입 자체는 계속 진행 가능해야 함 */ }

            // ✅ 약관 동의 — 전체 동의 / 개별 동의, 필수 항목에 모두 동의해야 가입(이메일·카카오·네이버 공통)
            const agreeAll = document.getElementById('agree-all');
            const agreeBoxes = [...document.querySelectorAll('#agree-box .agree-list input[type=checkbox]')];
            const agreeRequiredOk = () => [...document.querySelectorAll('.agree-req')].every(c => c.checked);
            const agreeHint = (show) => {
                const box = document.getElementById('agree-box'), m = document.getElementById('agree-msg');
                box.classList.toggle('need', !!show); m.classList.toggle('show', !!show);
                m.textContent = show ? '필수 항목(만 14세 이상, 이용약관, 개인정보 수집·이용)에 동의해주세요.' : '';
                if (show) box.scrollIntoView({ behavior: 'smooth', block: 'center' });
            };
            agreeAll.addEventListener('change', () => { agreeBoxes.forEach(c => { c.checked = agreeAll.checked; }); if (agreeRequiredOk()) agreeHint(false); });
            agreeBoxes.forEach(c => c.addEventListener('change', () => { agreeAll.checked = agreeBoxes.every(x => x.checked); if (agreeRequiredOk()) agreeHint(false); }));
            document.getElementById('agree-privacy-toggle').addEventListener('click', (e) => {
                const d = document.getElementById('agree-privacy-detail');
                d.hidden = !d.hidden;
                e.currentTarget.setAttribute('aria-expanded', String(!d.hidden));
                e.currentTarget.textContent = d.hidden ? '보기' : '닫기';
            });
            // 카카오/네이버로 가입 버튼도 필수 동의 전에는 막는다(버튼 자체 동작보다 먼저 확인)
            document.querySelector('.quick-join').addEventListener('click', (e) => {
                if (!e.target.closest('.qj-btn') || agreeRequiredOk()) return;
                e.preventDefault(); e.stopImmediatePropagation();
                agreeHint(true);
            }, true);

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                msg.className = 'msg';
                if (!agreeRequiredOk()) { agreeHint(true); return; }

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const password2 = document.getElementById('password2').value;

                if (password !== password2) {
                    msg.textContent = '비밀번호가 일치하지 않습니다.';
                    msg.className = 'msg error';
                    return;
                }
                if (password.length < 6) {
                    msg.textContent = '비밀번호는 6자 이상이어야 합니다.';
                    msg.className = 'msg error';
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = '가입 처리 중...';

                // 입력란에 직접 타이핑했거나 URL에서 채워진 추천코드를 로컬에 저장해둔다 - 가입 직후(즉시 세션 발급)든
                // 이메일 인증 후 나중에 로그인하는 경우든, 로그인 세션이 확인되는 시점에 서버에 등록을 시도한다(withplus-common.js).
                const referralCode = referralInput ? referralInput.value.trim().toUpperCase() : '';
                const marketingConsent = document.getElementById('marketing-consent').checked;
                try {
                    if (referralCode) localStorage.setItem('withplus_pending_referral', referralCode);
                    // 이메일 인증이 필요해 가입 즉시 세션이 나오지 않는 경우를 대비해 동의 여부를 임시 저장해두고,
                    // 이후 실제 로그인에 성공하는 시점(login.html)에 적용한다 - 추천인코드와 동일한 패턴.
                    if (marketingConsent) localStorage.setItem('withplus_pending_marketing_consent', '1');
                } catch (e) { /* ignore */ }

                try {
                    const client = await WithPlus.getClient();
                    // 인증 메일(Supabase 이메일 양식)에 가입한 사이트 이름을 넣고, 메일 링크를 누르면 이 사이트로 돌아오게 한다
                    // (두 사이트가 같은 Supabase 프로젝트를 써서, 양식은 하나 - {{ .Data.signup_site }} 로 사이트를 구분한다)
                    const { data, error } = await client.auth.signUp({
                        email,
                        password,
                        options: {
                            emailRedirectTo: location.origin + '/login',
                            data: { signup_site: 'WITH+', signup_site_url: location.origin }
                        }
                    });

                    if (error) {
                        msg.textContent = error.message === 'User already registered'
                            ? '이미 가입된 이메일입니다.'
                            : error.message;
                        msg.className = 'msg error';
                        submitBtn.disabled = false;
                        submitBtn.textContent = '회원가입';
                        return;
                    }

                    if (data.session) {
                        msg.textContent = '가입이 완료되었습니다! 이동 중...';
                        msg.className = 'msg success';
                        await WithPlus.applyPendingReferralIfAny();
                        if (marketingConsent) {
                            try {
                                await fetch('/api/me/profile', {
                                    method: 'PATCH',
                                    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + data.session.access_token },
                                    body: JSON.stringify({ marketing_consent: true })
                                });
                                localStorage.removeItem('withplus_pending_marketing_consent');
                            } catch (e) { /* 가입 자체는 이미 완료됐으므로 동의 반영 실패는 조용히 무시 - 마이페이지에서 다시 설정 가능 */ }
                        }
                        WithPlus.goAfterLogin(600);
                    } else {
                        msg.textContent = '가입이 완료되었습니다. 이메일 인증 후 로그인해주세요.';
                        msg.className = 'msg success';
                        submitBtn.disabled = false;
                        submitBtn.textContent = '회원가입';
                        setTimeout(() => { location.href = '/login'; }, 1800);
                    }
                } catch (err) {
                    msg.textContent = '가입 중 오류가 발생했습니다: ' + err.message;
                    msg.className = 'msg error';
                    submitBtn.disabled = false;
                    submitBtn.textContent = '회원가입';
                }
            });
        })();
        // 카카오/네이버로 가입: 실패하면 서버가 이 화면으로 ?social_error=와 함께 돌려보낸다
        (function () {
            const joinSocialMsg = document.getElementById('join-social-msg');
            const socialError = new URLSearchParams(location.search).get('social_error');
            if (socialError) { joinSocialMsg.textContent = socialError; joinSocialMsg.style.display = 'block'; }
            WithPlus.getLoginReturnPath(); // 가입 전 보던 페이지를 기억(가입·로그인 후 그 페이지로 복귀)
            WithPlus.bindSocialButtons({ kakao: document.getElementById('join-kakao-btn'), naver: document.getElementById('join-naver-btn') }, joinSocialMsg, {
                // 이동 직전에 입력해둔 추천인코드·마케팅 동의를 저장 - 로그인 완료 시점에 반영된다(이메일 가입과 같은 방식)
                beforeNavigate() {
                    try {
                        const ref = (document.getElementById('referral-code').value || '').trim().toUpperCase();
                        if (ref) localStorage.setItem('withplus_pending_referral', ref);
                        if (document.getElementById('marketing-consent').checked) localStorage.setItem('withplus_pending_marketing_consent', '1');
                    } catch (e) { /* ignore */ }
                }
            });
        })();
    </script>
</body>
</html>
