<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - WITH+</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary-color: #D32F5B; --primary-dark: #B0154F; --bg-light: #F5F5F5; --text-dark: #333; --text-gray: #666; --border-color: #E0E0E0; }
        body { font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text-dark); }
        .top-logo { text-align: center; padding: 30px 20px 10px; }
        .top-logo a { font-size: 1.8em; font-weight: bold; color: var(--primary-color); text-decoration: none; }
        .auth-wrap { max-width: 420px; margin: 20px auto 80px; padding: 0 20px; }
        .auth-box { background: white; border: 1px solid var(--border-color); border-radius: 16px; padding: 40px 30px; }
        .auth-box h1 { font-size: 1.4em; text-align: center; margin-bottom: 6px; }
        .auth-box .sub { text-align: center; color: var(--text-gray); font-size: 0.85em; margin-bottom: 25px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 0.85em; color: var(--text-gray); margin-bottom: 6px; }
        .field input { width: 100%; padding: 12px 14px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1em; }
        .field input:focus { outline: none; border-color: var(--primary-color); }
        .field .hint { font-size: 0.78em; color: #757575; margin-top: 4px; }
        .submit-btn { width: 100%; padding: 14px; background: var(--primary-color); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 1em; cursor: pointer; margin-top: 8px; }
        .submit-btn:hover { background: var(--primary-dark); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg { margin-top: 14px; font-size: 0.9em; padding: 10px 12px; border-radius: 8px; display: none; }
        .msg.error { display: block; background: #FDECEA; color: #C62828; }
        .msg.success { display: block; background: #E8F5E9; color: #2E7D32; }
        .links-row { text-align: center; margin-top: 20px; font-size: 0.9em; color: var(--text-gray); }
        .links-row a { color: var(--primary-color); text-decoration: none; font-weight: 600; }
        .back-home { text-align: center; margin-top: 16px; }
        .back-home a { color: var(--text-gray); text-decoration: none; font-size: 0.85em; }
    </style>
</head>
<body>
    <div class="top-logo"><a href="/">WITH+</a></div>
    <div class="auth-wrap">
        <div class="auth-box">
            <h1>회원가입</h1>
            <div class="sub">WITH+ 회원이 되고 마일리지 혜택을 받아보세요</div>
            <form id="join-form">
                <div class="field">
                    <label for="email">이메일</label>
                    <input type="email" id="email" required autocomplete="email">
                </div>
                <div class="field">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" required autocomplete="new-password" minlength="6">
                    <div class="hint">6자 이상 입력해주세요</div>
                </div>
                <div class="field">
                    <label for="password2">비밀번호 확인</label>
                    <input type="password" id="password2" required autocomplete="new-password" minlength="6">
                </div>
                <div class="field" id="referral-field" style="display:none;">
                    <label for="referral-code">추천인 코드 (선택)</label>
                    <input type="text" id="referral-code" placeholder="추천받은 코드가 있다면 입력해주세요" maxlength="20" style="text-transform:uppercase;">
                </div>
                <div class="field" style="display:flex; align-items:flex-start; gap:8px; background:var(--bg-light); padding:12px 14px; border-radius:8px;">
                    <input type="checkbox" id="marketing-consent" style="width:18px; height:18px; flex-shrink:0; margin-top:2px;">
                    <label for="marketing-consent" style="margin:0; font-size:0.82em; line-height:1.5; color:var(--text-dark);">마케팅 정보 활용에 동의합니다 (선택) — 맞춤 혜택/이벤트 안내에 활용되며, 가입 후 마이페이지에서 언제든 변경할 수 있습니다.</label>
                </div>
                <button type="submit" class="submit-btn" id="submit-btn">회원가입</button>
                <div class="msg" id="msg"></div>
            </form>
            <div class="links-row">이미 회원이신가요? <a href="/login">로그인</a></div>
        </div>
        <div class="back-home"><a href="/">← 홈으로 돌아가기</a></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/withplus-common.js"></script>
    <script>
        (async function () {
            const session = await WithPlus.getSession();
            if (session) { location.href = '/'; return; }

            const form = document.getElementById('join-form');
            const msg = document.getElementById('msg');
            const submitBtn = document.getElementById('submit-btn');
            const referralField = document.getElementById('referral-field');
            const referralInput = document.getElementById('referral-code');

            // 추천 링크(?ref=코드)로 들어왔으면 입력란을 보여주고 자동으로 채워둔다. 링크 없이 들어온 경우에도
            // 추천인 프로그램이 켜져 있으면(형님이 관리자에서 활성화한 경우) 직접 입력할 수 있도록 항상 보여준다.
            try {
                const refFromUrl = new URLSearchParams(location.search).get('ref');
                if (refFromUrl) {
                    referralInput.value = refFromUrl.trim().toUpperCase();
                    referralField.style.display = '';
                } else {
                    const res = await fetch('/api/settings/referral-program');
                    const json = await res.json();
                    if (res.ok && json.success && json.data.enabled) referralField.style.display = '';
                }
            } catch (e) { /* 추천인 프로그램 상태 조회 실패는 조용히 무시 - 가입 자체는 계속 진행 가능해야 함 */ }

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                msg.className = 'msg';

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const password2 = document.getElementById('password2').value;

                if (password !== password2) {
                    msg.textContent = '비밀번호가 일치하지 않습니다.';
                    msg.className = 'msg error';
                    return;
                }
                if (password.length < 6) {
                    msg.textContent = '비밀번호는 6자 이상이어야 합니다.';
                    msg.className = 'msg error';
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = '가입 처리 중...';

                // 입력란에 직접 타이핑했거나 URL에서 채워진 추천코드를 로컬에 저장해둔다 - 가입 직후(즉시 세션 발급)든
                // 이메일 인증 후 나중에 로그인하는 경우든, 로그인 세션이 확인되는 시점에 서버에 등록을 시도한다(withplus-common.js).
                const referralCode = referralInput ? referralInput.value.trim().toUpperCase() : '';
                const marketingConsent = document.getElementById('marketing-consent').checked;
                try {
                    if (referralCode) localStorage.setItem('withplus_pending_referral', referralCode);
                    // 이메일 인증이 필요해 가입 즉시 세션이 나오지 않는 경우를 대비해 동의 여부를 임시 저장해두고,
                    // 이후 실제 로그인에 성공하는 시점(login.html)에 적용한다 - 추천인코드와 동일한 패턴.
                    if (marketingConsent) localStorage.setItem('withplus_pending_marketing_consent', '1');
                } catch (e) { /* ignore */ }

                try {
                    const client = await WithPlus.getClient();
                    const { data, error } = await client.auth.signUp({ email, password });

                    if (error) {
                        msg.textContent = error.message === 'User already registered'
                            ? '이미 가입된 이메일입니다.'
                            : error.message;
                        msg.className = 'msg error';
                        submitBtn.disabled = false;
                        submitBtn.textContent = '회원가입';
                        return;
                    }

                    if (data.session) {
                        msg.textContent = '가입이 완료되었습니다! 이동 중...';
                        msg.className = 'msg success';
                        await WithPlus.applyPendingReferralIfAny();
                        if (marketingConsent) {
                            try {
                                await fetch('/api/me/profile', {
                                    method: 'PATCH',
                                    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + data.session.access_token },
                                    body: JSON.stringify({ marketing_consent: true })
                                });
                                localStorage.removeItem('withplus_pending_marketing_consent');
                            } catch (e) { /* 가입 자체는 이미 완료됐으므로 동의 반영 실패는 조용히 무시 - 마이페이지에서 다시 설정 가능 */ }
                        }
                        setTimeout(() => { location.href = '/'; }, 600);
                    } else {
                        msg.textContent = '가입이 완료되었습니다. 이메일 인증 후 로그인해주세요.';
                        msg.className = 'msg success';
                        submitBtn.disabled = false;
                        submitBtn.textContent = '회원가입';
                        setTimeout(() => { location.href = '/login'; }, 1800);
                    }
                } catch (err) {
                    msg.textContent = '가입 중 오류가 발생했습니다: ' + err.message;
                    msg.className = 'msg error';
                    submitBtn.disabled = false;
                    submitBtn.textContent = '회원가입';
                }
            });
        })();
    </script>
</body>
</html>
