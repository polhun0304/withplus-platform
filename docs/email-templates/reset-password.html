<!--
  Supabase > Authentication > Emails > Templates > "Reset Password" 에 붙여넣는 한글 비밀번호 재설정 메일
  제목(Subject): 비밀번호 재설정 안내
  (예전에 가입한 회원은 .Data.signup_site 가 없어서 "WITH+ · LIVE+"로 표시된다)
-->
{{ $site := "WITH+ · LIVE+" }}{{ if .Data.signup_site }}{{ $site = .Data.signup_site }}{{ end }}
<div style="max-width:520px; margin:0 auto; padding:32px 24px; font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:#222; line-height:1.7;">
  <h2 style="margin:0 0 16px; font-size:22px;">{{ $site }} 비밀번호 재설정</h2>
  <p style="margin:0 0 20px;">비밀번호 재설정을 요청하셨습니다.<br>아래 버튼을 눌러 새 비밀번호를 정해주세요.</p>
  <p style="margin:0 0 24px;">
    <a href="{{ .ConfirmationURL }}" style="display:inline-block; padding:14px 28px; background:#D32F5B; color:#fff; text-decoration:none; border-radius:10px; font-weight:700;">비밀번호 재설정하기</a>
  </p>
  <p style="margin:0 0 8px; font-size:13px; color:#666;">버튼이 눌리지 않으면 아래 주소를 복사해 브라우저 주소창에 붙여넣어 주세요.</p>
  <p style="margin:0 0 24px; font-size:12px; color:#888; word-break:break-all;">{{ .ConfirmationURL }}</p>
  <p style="margin:0; font-size:12px; color:#999;">본인이 요청하지 않으셨다면 이 메일은 무시하셔도 됩니다. 비밀번호는 바뀌지 않습니다.</p>
</div>
